<text x="61.0" y="505.2" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >5</text>
<line x1="64.0" y1="451.2" x2="68.0" y2="451.2" stroke="#8a8984" stroke-width="1.0"/>
<text x="61.0" y="455.2" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >10</text>
<line x1="314.0" y1="431.2" x2="314.0" y2="551.2" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="4 4"/>
