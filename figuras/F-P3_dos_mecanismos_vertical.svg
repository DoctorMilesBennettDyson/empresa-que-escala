<text x="326.3" y="470.7" font-size="12.5" fill="#2a78d6" font-weight="700" text-anchor="start" >De 4,4 a 3,9: lo aprendido queda y</text>
<text x="326.3" y="487.5" font-size="12.5" fill="#2a78d6" font-weight="700" text-anchor="start" >sigue bajando</text>
<text x="68.0" y="569.2" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >0</text>
<text x="191.0" y="569.2" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >6</text>
<text x="314.0" y="569.2" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >12</text>
<text x="437.0" y="569.2" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >18</text>
<text x="560.0" y="569.2" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >24 meses</text>
<line x1="40.0" y1="599.2" x2="560.0" y2="599.2" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="626.2" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >La economía de escala se pierde el mes en que caen las ventas;</text>
<text x="40.0" y="646.4" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >lo aprendido queda y sigue bajando el costo.</text>
<text x="40.0" y="667.2" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Son dos mecanismos que se confunden: uno reparte el costo fijo entre lo que se</text>
<text x="40.0" y="684.4" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >vende hoy; el otro depende de todo lo que se hizo desde el primer día.</text>
<text x="40.0" y="708.2" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Números ilustrativos: costo fijo de 10.000 por mes; costo variable de 10 con 2.000 unidades</text>
<text x="40.0" y="723.8" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >hechas, que baja 20 % por duplicación (ley de Wright). Lo aprendido tampoco es eterno: se</text>
<text x="40.0" y="739.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >desgasta si no se usa y se va con la gente que se va (Argote y Epple 1990).</text>
