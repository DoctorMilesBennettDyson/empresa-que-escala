<text x="61.0" y="305.8" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >5</text>
<line x1="64.0" y1="251.8" x2="68.0" y2="251.8" stroke="#8a8984" stroke-width="1.0"/>
<text x="61.0" y="255.8" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >10</text>
<line x1="314.0" y1="231.8" x2="314.0" y2="351.8" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="68.0" y1="301.8" x2="314.0" y2="301.8" stroke="#2a78d6" stroke-width="2.5"/>
<line x1="314.0" y1="301.8" x2="314.0" y2="251.8" stroke="#eb6834" stroke-width="2.5"/>
<line x1="314.0" y1="251.8" x2="560.0" y2="251.8" stroke="#eb6834" stroke-width="2.5"/>
<text x="326.3" y="271.3" font-size="12.5" fill="#eb6834" font-weight="700" text-anchor="start" >De 5 a 10 por unidad: se pierde el</text>
<text x="326.3" y="288.1" font-size="12.5" fill="#eb6834" font-weight="700" text-anchor="start" >mismo mes</text>
<text x="40.0" y="381.8" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Curva de aprendizaje: el costo variable</text>
<text x="40.0" y="400.8" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Baja 20 % cada vez que se duplica lo producido desde el primer día. Depende de todo lo</text>
<text x="40.0" y="417.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >hecho.</text>
<line x1="68.0" y1="551.2" x2="560.0" y2="551.2" stroke="#8a8984" stroke-width="1.2"/>
<line x1="68.0" y1="451.2" x2="560.0" y2="451.2" stroke="#e6e5e0" stroke-width="1.0"/>
