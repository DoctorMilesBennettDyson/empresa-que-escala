<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1098" width="600" height="1098" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Los doce errores, en su lugar</title>
<desc id="d">Los doce errores de la Parte 7 ubicados por su antídoto: seis sobre los cinco niveles (el 4 en el nivel 1; el 2 y el 6 en el 2; el 11 en el 3; el 1 en el 4; el 7 en el 5) y seis fuera de la escalera (3, 5, 8, 9, 10 y 12).</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="600" height="1098" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Dónde se comete cada uno de los doce</text>
<text x="40.0" y="64.3" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >errores?</text>
<text x="40.0" y="86.1" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Cada error de la Parte 7 va donde apunta su antídoto: a uno de los cinco</text>
<text x="40.0" y="104.7" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >niveles, o a una receta o una prueba que no está en ninguna cuenta.</text>
<text x="40.0" y="145.9" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Sobre la escalera: se frenan midiendo ese nivel</text>
<circle cx="193.0" cy="179.9" r="11" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.6"/>
<text x="193.0" y="184.4" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >7</text>
<text x="213.0" y="181.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Confundir capital con clientes</text>
<text x="213.0" y="198.1" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: si mañana aparecieran diez clientes, ¿se los</text>
<text x="213.0" y="213.7" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >podría atender? (§3.5)</text>
<rect x="40.0" y="167.9" width="128.0" height="51.4" rx="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="50.0" y="185.9" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >Nivel 5</text>
<text x="50.0" y="202.4" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Capital y ruina</text>
<circle cx="193.0" cy="241.3" r="11" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.6"/>
<text x="193.0" y="245.8" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >1</text>
<text x="213.0" y="243.3" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >El volante dibujado</text>
<text x="213.0" y="259.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: un número en dos flechas, o admitirlo como</text>
<text x="213.0" y="275.2" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >hipótesis</text>
<rect x="40.0" y="229.3" width="128.0" height="51.5" rx="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="50.0" y="247.3" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >Nivel 4</text>
<text x="50.0" y="263.8" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >El lazo</text>
<circle cx="193.0" cy="302.8" r="11" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.6"/>
<text x="193.0" y="307.3" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >11</text>
<text x="213.0" y="304.8" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Casarse con la curva</text>
<text x="213.0" y="321.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: cada cierto número de duplicaciones, preguntar</text>
<text x="213.0" y="336.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >qué cambió en el cliente</text>
<rect x="40.0" y="290.8" width="128.0" height="62.5" rx="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="50.0" y="308.8" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >Nivel 3</text>
<text x="50.0" y="325.3" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Curva de</text>
<text x="50.0" y="340.5" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >aprendizaje</text>
<circle cx="193.0" cy="375.3" r="11" fill="#eb6834" stroke="#eb6834" stroke-width="1.6"/>
<circle cx="193.0" cy="375.3" r="14.5" fill="none" stroke="#eb6834" stroke-width="1.4"/>
<text x="193.0" y="379.8" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >2</text>
<text x="213.0" y="377.3" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >La escala como tapa del margen</text>
<text x="213.0" y="393.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: medir el margen (G1) antes de buscar la curva</text>
<text x="213.0" y="409.1" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >(G2)</text>
<text x="213.0" y="425.7" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >la forma más común de quebrar creciendo (§6.3)</text>
<circle cx="193.0" cy="449.3" r="11" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.6"/>
<text x="193.0" y="453.8" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >6</text>
<text x="213.0" y="451.3" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >La dependencia disfrazada de margen</text>
<text x="213.0" y="467.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: calcular el margen sin ese renglón</text>
<rect x="40.0" y="363.3" width="128.0" height="109.9" rx="5" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.4"/>
<text x="50.0" y="381.3" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >Nivel 2</text>
<text x="50.0" y="397.8" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Margen</text>
<circle cx="193.0" cy="495.2" r="11" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.6"/>
<text x="193.0" y="499.7" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >4</text>
<text x="213.0" y="497.2" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >La plataforma sin cliente</text>
<text x="213.0" y="513.4" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: el control G0 y la prueba del peldaño</text>
<rect x="40.0" y="483.2" width="128.0" height="47.2" rx="5" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.4"/>
<text x="50.0" y="501.2" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >Nivel 1</text>
<text x="50.0" y="517.7" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Repetir</text>
<text x="40.0" y="568.4" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Fuera de la escalera: no aparecen en ninguna cuenta</text>
<circle cx="51.0" cy="601.9" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6"/>
<text x="51.0" y="606.4" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle" >3</text>
<text x="71.0" y="603.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Automatizar el paso que había que borrar</text>
<text x="71.0" y="620.2" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: la receta R4, el algoritmo de cinco pasos</text>
<circle cx="51.0" cy="645.8" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6"/>
<text x="51.0" y="650.3" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle" >5</text>
<text x="71.0" y="647.8" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >El sueño sin promesa con fecha</text>
<text x="71.0" y="664.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: una promesa chica, con fecha, que pueda resultar falsa en 90 días</text>
<circle cx="51.0" cy="689.6" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6"/>
<text x="51.0" y="694.1" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle" >8</text>
<text x="71.0" y="691.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Copiar el rasgo en vez del mecanismo</text>
<text x="71.0" y="707.9" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: copiar el mecanismo, que es barato</text>
<circle cx="51.0" cy="733.5" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6"/>
<text x="51.0" y="738.0" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle" >9</text>
<text x="71.0" y="735.5" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >El sesgo de supervivencia como plan</text>
<text x="71.0" y="751.7" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: por cada éxito, buscar dos parecidos que desaparecieron</text>
<circle cx="51.0" cy="777.3" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6"/>
<text x="51.0" y="781.8" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle" >10</text>
<text x="71.0" y="779.3" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >El genio solo</text>
<text x="71.0" y="795.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: la prueba de las seis funciones (§1.3)</text>
<circle cx="51.0" cy="821.2" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6"/>
<text x="51.0" y="825.7" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle" >12</text>
<text x="71.0" y="823.2" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Crecer más rápido que la calidad</text>
<text x="71.0" y="839.4" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: que el control de calidad escale antes que el volumen</text>
<line x1="40.0" y1="861.0" x2="560.0" y2="861.0" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="888.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Seis de los doce errores se cometen sobre la escalera, y se</text>
<text x="40.0" y="908.3" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >frenan midiendo el nivel donde ocurren; los otros seis no</text>
<text x="40.0" y="928.5" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >aparecen en ninguna cuenta y se frenan con una receta, una</text>
<text x="40.0" y="948.8" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >prueba o una pregunta.</text>
<text x="40.0" y="969.5" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >El error 2, escalar antes de tener margen, se siente como éxito hasta el último</text>
<text x="40.0" y="986.8" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >mes.</text>
<text x="40.0" y="1010.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >[interpretación] La Parte 7 nombra el nivel sólo en el error 1; en los errores 2, 4 y 7 se</text>
<text x="40.0" y="1026.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >deduce del control o la sección que cita el antídoto (G1, G0, §3.5), y en los errores 6 y 11,</text>
<text x="40.0" y="1041.8" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >de lo que mide el antídoto (el margen, las duplicaciones). Que el error 2 sea el más común lo</text>
<text x="40.0" y="1057.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >afirma el libro (§6.3); nadie lo midió.</text>
<text x="40.0" y="1079.0" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>