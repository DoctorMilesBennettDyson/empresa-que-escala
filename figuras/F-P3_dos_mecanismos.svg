<text x="266.0" y="146.6" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle" >2.000 por mes</text>
<text x="662.0" y="154.6" font-size="11.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" >1.000</text>
<line x1="464.0" y1="122.6" x2="464.0" y2="158.6" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="40.0" y="198.6" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Economía de escala: el costo fijo repartido</text>
<text x="40.0" y="217.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >10.000 por mes ÷ unidades vendidas ese mes. Depende de cuánto se vende hoy.</text>
