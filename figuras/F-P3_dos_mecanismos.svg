<title id="t">Dos mecanismos que bajan el costo</title>
<desc id="d">Dos paneles con el mismo eje de 24 meses: el costo fijo por unidad salta de 5 a 10 cuando las ventas caen a la mitad; el costo variable, que sigue la ley de Wright, sigue bajando.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="900" height="748" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Qué se pierde si las ventas caen a la mitad?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Las dos partes del costo de cada unidad, mes a mes, en una fábrica que vende 2.000 unidades por mes y desde el mes 12</text>
<text x="40.0" y="77.4" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >vende 1.000.</text>
<text x="40.0" y="116.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Ventas por mes</text>
<text x="472.0" y="116.6" font-size="12.5" fill="#eb6834" font-weight="700" text-anchor="start" >mes 12: las ventas caen a la mitad</text>
