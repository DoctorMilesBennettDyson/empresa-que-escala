<text x="483.8" y="454.5" font-size="12.5" fill="#2a78d6" font-weight="700" text-anchor="start" >De 4,4 a 3,9: lo aprendido queda y sigue bajando</text>
<text x="68.0" y="553.0" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >0</text>
