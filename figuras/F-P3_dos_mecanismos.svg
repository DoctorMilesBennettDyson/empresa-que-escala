<text x="662.0" y="553.0" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >18</text>
<text x="860.0" y="553.0" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >24 meses</text>
<line x1="40.0" y1="583.0" x2="860.0" y2="583.0" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="610.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >La economía de escala se pierde el mes en que caen las ventas; lo aprendido queda y sigue bajando el</text>
<text x="40.0" y="630.2" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >costo.</text>
<text x="40.0" y="651.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Son dos mecanismos que se confunden: uno reparte el costo fijo entre lo que se vende hoy; el otro depende de todo lo que se hizo</text>
<text x="40.0" y="668.2" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >desde el primer día.</text>
<text x="40.0" y="692.0" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Números ilustrativos: costo fijo de 10.000 por mes; costo variable de 10 con 2.000 unidades hechas, que baja 20 % por duplicación (ley de Wright). Lo</text>
<text x="40.0" y="707.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >aprendido tampoco es eterno: se desgasta si no se usa y se va con la gente que se va (Argote y Epple 1990).</text>
