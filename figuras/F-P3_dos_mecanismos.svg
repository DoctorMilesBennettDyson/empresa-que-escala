<line x1="464.0" y1="251.8" x2="860.0" y2="251.8" stroke="#eb6834" stroke-width="2.5"/>
<text x="483.8" y="271.3" font-size="12.5" fill="#eb6834" font-weight="700" text-anchor="start" >De 5 a 10 por unidad: se pierde el mismo mes</text>
<text x="40.0" y="381.8" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Curva de aprendizaje: el costo variable</text>
<text x="40.0" y="400.8" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Baja 20 % cada vez que se duplica lo producido desde el primer día. Depende de todo lo hecho.</text>
