<rect width="900" height="572" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Alcanza la caja para llegar al fondo del pozo?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Faltan 10 duplicaciones y cada una tarda 8 meses: 80 meses, casi 7 años, perdiendo dinero cada mes un poco menos.</text>
