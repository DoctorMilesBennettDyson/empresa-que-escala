<line x1="40.0" y1="423.9" x2="860.0" y2="423.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="450.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Si la caja es menos profunda que el pozo, el plan no es un plan: con 250.000, se acaba en el mes 31,</text>
<text x="40.0" y="471.2" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >cuatro años antes del fondo.</text>
<text x="40.0" y="491.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Antes de empezar: profundidad y ancho del pozo contra la caja y los meses de autonomía.</text>
<text x="40.0" y="515.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Ilustrativo: la pérdida arranca en 10.000 por mes y baja en línea recta hasta cero en el mes 80; profundidad = 10.000 × 80 ÷ 2. La fórmula del texto</text>
<text x="40.0" y="531.3" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >supone la pérdida constante y da el doble: es la cota prudente. Con retardos (§3.4) el pozo es más ancho.</text>
