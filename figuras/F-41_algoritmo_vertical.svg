<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 587" width="600" height="587" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">El algoritmo, en los dos órdenes</title>
<desc id="d">Diez pasos: en el orden correcto se borran cuatro y se automatizan seis; en el habitual se automatizan los diez, y los cuatro que sobraban quedan escondidos dentro de la automatización.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="600" height="587" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Qué pasa si se automatiza antes de borrar?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Un proceso de diez pasos, de los que cuatro no deberían existir, en los dos</text>
<text x="40.0" y="77.4" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >órdenes.</text>
<text x="40.0" y="117.1" font-size="12.5" fill="#52514e" font-weight="600" text-anchor="start" >El orden: 1 cuestionar el requisito → 2 borrar → 3 simplificar → 4 acelerar →</text>
<text x="40.0" y="134.3" font-size="12.5" fill="#52514e" font-weight="600" text-anchor="start" >5 automatizar, último.</text>
<text x="40.0" y="169.1" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >A · Orden correcto: cuestionar y borrar primero</text>
<rect x="40.0" y="182.4" width="46.6" height="46.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1.0"/>
<text x="63.3" y="243.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >1</text>
<rect x="92.6" y="182.4" width="46.6" height="46.0" rx="4" fill="#fcfcfb" stroke="#8a8984" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="106.6" y1="196.2" x2="125.2" y2="214.6" stroke="#8a8984" stroke-width="1.6"/>
<line x1="125.2" y1="196.2" x2="106.6" y2="214.6" stroke="#8a8984" stroke-width="1.6"/>
<text x="115.9" y="243.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >2</text>
<rect x="145.2" y="182.4" width="46.6" height="46.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1.0"/>
<text x="168.5" y="243.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >3</text>
<rect x="197.8" y="182.4" width="46.6" height="46.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1.0"/>
<text x="221.1" y="243.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >4</text>
<rect x="250.4" y="182.4" width="46.6" height="46.0" rx="4" fill="#fcfcfb" stroke="#8a8984" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="264.4" y1="196.2" x2="283.0" y2="214.6" stroke="#8a8984" stroke-width="1.6"/>
<line x1="283.0" y1="196.2" x2="264.4" y2="214.6" stroke="#8a8984" stroke-width="1.6"/>
<text x="273.7" y="243.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >5</text>
<rect x="303.0" y="182.4" width="46.6" height="46.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1.0"/>
<text x="326.3" y="243.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >6</text>
<rect x="355.6" y="182.4" width="46.6" height="46.0" rx="4" fill="#fcfcfb" stroke="#8a8984" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="369.6" y1="196.2" x2="388.2" y2="214.6" stroke="#8a8984" stroke-width="1.6"/>
<line x1="388.2" y1="196.2" x2="369.6" y2="214.6" stroke="#8a8984" stroke-width="1.6"/>
<text x="378.9" y="243.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >7</text>
<rect x="408.2" y="182.4" width="46.6" height="46.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1.0"/>
<text x="431.5" y="243.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >8</text>
<rect x="460.8" y="182.4" width="46.6" height="46.0" rx="4" fill="#fcfcfb" stroke="#8a8984" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="474.8" y1="196.2" x2="493.4" y2="214.6" stroke="#8a8984" stroke-width="1.6"/>
<line x1="493.4" y1="196.2" x2="474.8" y2="214.6" stroke="#8a8984" stroke-width="1.6"/>
<text x="484.1" y="243.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >9</text>
<rect x="513.4" y="182.4" width="46.6" height="46.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1.0"/>
<text x="536.7" y="243.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >10</text>
<text x="40.0" y="264.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Quedan 6 pasos, y recién ahí se automatizan. Los 4 borrados (×) ya no cuestan nada.</text>
<text x="40.0" y="301.6" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >B · Orden habitual: automatizar lo que existe</text>
<rect x="40.0" y="314.9" width="46.6" height="46.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.0"/>
<text x="63.3" y="375.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >1</text>
<rect x="92.6" y="314.9" width="46.6" height="46.0" rx="4" fill="url(#rayas)" stroke="#eb6834" stroke-width="1.6"/>
<text x="115.9" y="375.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >2</text>
<rect x="145.2" y="314.9" width="46.6" height="46.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.0"/>
<text x="168.5" y="375.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >3</text>
<rect x="197.8" y="314.9" width="46.6" height="46.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.0"/>
<text x="221.1" y="375.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >4</text>
<rect x="250.4" y="314.9" width="46.6" height="46.0" rx="4" fill="url(#rayas)" stroke="#eb6834" stroke-width="1.6"/>
<text x="273.7" y="375.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >5</text>
<rect x="303.0" y="314.9" width="46.6" height="46.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.0"/>
<text x="326.3" y="375.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >6</text>
<rect x="355.6" y="314.9" width="46.6" height="46.0" rx="4" fill="url(#rayas)" stroke="#eb6834" stroke-width="1.6"/>
<text x="378.9" y="375.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >7</text>
<rect x="408.2" y="314.9" width="46.6" height="46.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.0"/>
<text x="431.5" y="375.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >8</text>
<rect x="460.8" y="314.9" width="46.6" height="46.0" rx="4" fill="url(#rayas)" stroke="#eb6834" stroke-width="1.6"/>
<text x="484.1" y="375.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >9</text>
<rect x="513.4" y="314.9" width="46.6" height="46.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.0"/>
<text x="536.7" y="375.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >10</text>
<text x="40.0" y="397.4" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Los 10 automatizados. Los 4 que sobraban (rayados) siguen costando, y ahora nadie</text>
<text x="40.0" y="414.7" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >los ve.</text>
<line x1="40.0" y1="437.4" x2="560.0" y2="437.4" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="464.4" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Automatizar lo que había que borrar lo vuelve invisible: el paso</text>
<text x="40.0" y="484.7" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >sigue costando, pero ya nadie lo mira.</text>
<text x="40.0" y="505.4" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Calibración: si no hace falta volver a agregar al menos el 10 % de lo que se borró,</text>
<text x="40.0" y="522.7" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >no se borró suficiente.</text>
<text x="40.0" y="546.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Proceso ilustrativo. La regla del 10 % es una heurística de práctica, no un resultado medido.</text>
<text x="40.0" y="568.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>