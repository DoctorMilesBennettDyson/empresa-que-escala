<text x="40.0" y="324.9" font-size="13.5" fill="#eb6834" font-weight="700" text-anchor="start" >3,7 contrataciones por cada puesto: una rotación de alrededor del 370 %</text>
<text x="40.0" y="364.6" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Jornal básico por día, en dólares de cada año</text>
<text x="40.0" y="387.6" font-size="12" fill="#52514e" font-weight="600" text-anchor="start" >antes de enero de 1914</text>
<rect x="40.0" y="393.6" width="280.8" height="22.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="328.8" y="409.6" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >US$2,34</text>
<text x="40.0" y="439.6" font-size="12" fill="#52514e" font-weight="600" text-anchor="start" >desde enero de 1914</text>
<rect x="40.0" y="445.6" width="600.0" height="22.0" fill="#2a78d6"/>
<text x="648.0" y="461.6" font-size="13.5" fill="#2a78d6" font-weight="700" text-anchor="start" >US$5,00 · más del doble</text>
<line x1="40.0" y1="487.6" x2="860.0" y2="487.6" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="514.6" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Para sostener 13.623 puestos, Ford contrató a 50.448 personas en un año: 3,7 por puesto. El jornal de</text>
<text x="40.0" y="534.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >cinco dólares fue el precio de retener gente en un trabajo muy duro.</text>
<text x="40.0" y="555.6" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Una compensación mide el costo de lo que compensa; no prueba que fuera bueno.</text>
<text x="40.0" y="579.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >[reportado — Raff y Summers 1987; archivo de The Henry Ford]. 50.448 ÷ 13.623 ≈ 3,7: una rotación de alrededor del 370 % [cálculo]. La última figura</text>
<text x="40.0" y="595.0" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >de cada grupo es parcial. Jornal en dólares de cada año, sin ajustar por inflación.</text>
