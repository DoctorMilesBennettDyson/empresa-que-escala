<text x="240.0" y="113.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="end" >1981-2011</text>
<rect x="250.0" y="85.9" width="485.7" height="32.0" fill="#eb6834"/>
<text x="743.7" y="106.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >54.500</text>
<line x1="250.0" y1="79.9" x2="250.0" y2="123.9" stroke="#8a8984" stroke-width="1.0"/>
<line x1="250.0" y1="135.9" x2="250.0" y2="175.9" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="380.0" y1="135.9" x2="380.0" y2="175.9" stroke="#e6e5e0" stroke-width="1.0"/>
