<text x="510.0" y="245.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >1.000</text>
<text x="640.0" y="245.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >10.000</text>
<text x="770.0" y="245.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >100.000</text>
<line x1="40.0" y1="269.9" x2="860.0" y2="269.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="296.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Del transbordador al Falcon 9, el costo por kilo se dividió por 20. El objetivo del Starship pide</text>
<text x="40.0" y="317.2" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >dividirlo otra vez por 27.</text>
<text x="40.0" y="337.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Eso no sale de optimizar el cohete anterior: sale de cambiar el diseño entero (figura 2).</text>
<text x="40.0" y="361.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Transbordador y Falcon 9: Jones 2018 (NASA). Barra hueca: objetivo declarado por SpaceX, no un costo medido.</text>
