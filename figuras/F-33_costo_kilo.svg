<text x="240.0" y="152.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end" >Falcon 9</text>
<text x="240.0" y="167.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="end" >Jones 2018</text>
<rect x="250.0" y="139.9" width="316.5" height="32.0" fill="#2a78d6"/>
<text x="574.5" y="160.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >2.720</text>
<line x1="250.0" y1="133.9" x2="250.0" y2="177.9" stroke="#8a8984" stroke-width="1.0"/>
<line x1="250.0" y1="189.9" x2="250.0" y2="229.9" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="380.0" y1="189.9" x2="380.0" y2="229.9" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="510.0" y1="189.9" x2="510.0" y2="229.9" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="640.0" y1="189.9" x2="640.0" y2="229.9" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="770.0" y1="189.9" x2="770.0" y2="229.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="240.0" y="206.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end" >Starship</text>
<text x="240.0" y="221.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="end" >objetivo declarado, no un dato</text>
<rect x="250.0" y="193.9" width="130.0" height="32.0" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2.25"/>
<text x="388.0" y="214.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >≈ 100</text>
<line x1="250.0" y1="187.9" x2="250.0" y2="231.9" stroke="#8a8984" stroke-width="1.0"/>
