<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 516" width="900" height="516" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">El algoritmo, en los dos órdenes</title>
<desc id="d">Diez pasos: en el orden correcto se borran cuatro y se automatizan seis; en el habitual se automatizan los diez, y los cuatro que sobraban quedan escondidos dentro de la automatización.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="900" height="516" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Qué pasa si se automatiza antes de borrar?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Un proceso de diez pasos, de los que cuatro no deberían existir, en los dos órdenes.</text>
<text x="40.0" y="98.4" font-size="12.5" fill="#52514e" font-weight="600" text-anchor="start" >El orden: 1 cuestionar el requisito → 2 borrar → 3 simplificar → 4 acelerar → 5 automatizar, último.</text>
<text x="40.0" y="133.2" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >A · Orden correcto: cuestionar y borrar primero</text>
<rect x="40.0" y="146.5" width="74.8" height="46.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1.0"/>
<text x="77.4" y="207.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >1</text>
<rect x="122.8" y="146.5" width="74.8" height="46.0" rx="4" fill="#fcfcfb" stroke="#8a8984" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="145.2" y1="160.3" x2="175.2" y2="178.7" stroke="#8a8984" stroke-width="1.6"/>
<line x1="175.2" y1="160.3" x2="145.2" y2="178.7" stroke="#8a8984" stroke-width="1.6"/>
<text x="160.2" y="207.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >2</text>
<rect x="205.6" y="146.5" width="74.8" height="46.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1.0"/>
<text x="243.0" y="207.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >3</text>
<rect x="288.4" y="146.5" width="74.8" height="46.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1.0"/>
<text x="325.8" y="207.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >4</text>
<rect x="371.2" y="146.5" width="74.8" height="46.0" rx="4" fill="#fcfcfb" stroke="#8a8984" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="393.6" y1="160.3" x2="423.6" y2="178.7" stroke="#8a8984" stroke-width="1.6"/>
<line x1="423.6" y1="160.3" x2="393.6" y2="178.7" stroke="#8a8984" stroke-width="1.6"/>
<text x="408.6" y="207.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >5</text>
<rect x="454.0" y="146.5" width="74.8" height="46.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1.0"/>
