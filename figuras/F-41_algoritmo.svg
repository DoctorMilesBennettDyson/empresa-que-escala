<rect x="536.8" y="146.5" width="74.8" height="46.0" rx="4" fill="#fcfcfb" stroke="#8a8984" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="559.2" y1="160.3" x2="589.2" y2="178.7" stroke="#8a8984" stroke-width="1.6"/>
<line x1="589.2" y1="160.3" x2="559.2" y2="178.7" stroke="#8a8984" stroke-width="1.6"/>
<text x="574.2" y="207.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >7</text>
<rect x="619.6" y="146.5" width="74.8" height="46.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1.0"/>
<text x="657.0" y="207.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >8</text>
<rect x="702.4" y="146.5" width="74.8" height="46.0" rx="4" fill="#fcfcfb" stroke="#8a8984" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="724.8" y1="160.3" x2="754.8" y2="178.7" stroke="#8a8984" stroke-width="1.6"/>
<line x1="754.8" y1="160.3" x2="724.8" y2="178.7" stroke="#8a8984" stroke-width="1.6"/>
<text x="739.8" y="207.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >9</text>
<rect x="785.2" y="146.5" width="74.8" height="46.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1.0"/>
<text x="822.6" y="207.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >10</text>
<text x="40.0" y="229.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Quedan 6 pasos, y recién ahí se automatizan. Los 4 borrados (×) ya no cuestan nada.</text>
<text x="40.0" y="265.8" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >B · Orden habitual: automatizar lo que existe</text>
<rect x="40.0" y="279.1" width="74.8" height="46.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.0"/>
<text x="77.4" y="340.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >1</text>
<rect x="122.8" y="279.1" width="74.8" height="46.0" rx="4" fill="url(#rayas)" stroke="#eb6834" stroke-width="1.6"/>
<text x="160.2" y="340.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >2</text>
<rect x="205.6" y="279.1" width="74.8" height="46.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.0"/>
<text x="243.0" y="340.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >3</text>
<rect x="288.4" y="279.1" width="74.8" height="46.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.0"/>
<text x="325.8" y="340.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >4</text>
<rect x="371.2" y="279.1" width="74.8" height="46.0" rx="4" fill="url(#rayas)" stroke="#eb6834" stroke-width="1.6"/>
<text x="408.6" y="340.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >5</text>
<rect x="454.0" y="279.1" width="74.8" height="46.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.0"/>
<text x="491.4" y="340.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >6</text>
<rect x="536.8" y="279.1" width="74.8" height="46.0" rx="4" fill="url(#rayas)" stroke="#eb6834" stroke-width="1.6"/>
<text x="574.2" y="340.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >7</text>
<rect x="619.6" y="279.1" width="74.8" height="46.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.0"/>
<text x="657.0" y="340.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >8</text>
<rect x="702.4" y="279.1" width="74.8" height="46.0" rx="4" fill="url(#rayas)" stroke="#eb6834" stroke-width="1.6"/>
<text x="739.8" y="340.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >9</text>
<rect x="785.2" y="279.1" width="74.8" height="46.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1.0"/>
<text x="822.6" y="340.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >10</text>
<text x="40.0" y="361.6" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Los 10 automatizados. Los 4 que sobraban (rayados) siguen costando, y ahora nadie los ve.</text>
<line x1="40.0" y1="384.3" x2="860.0" y2="384.3" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="411.3" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Automatizar lo que había que borrar lo vuelve invisible: el paso sigue costando, pero ya nadie lo</text>
<text x="40.0" y="431.6" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >mira.</text>
<text x="40.0" y="452.3" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Calibración: si no hace falta volver a agregar al menos el 10 % de lo que se borró, no se borró suficiente.</text>
<text x="40.0" y="476.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Proceso ilustrativo. La regla del 10 % es una heurística de práctica, no un resultado medido.</text>
<text x="40.0" y="497.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
