<text x="40.0" y="316.4" font-size="13.5" fill="#eb6834" font-weight="700" text-anchor="start" >3,7 contrataciones por cada puesto: una rotación de alrededor del 370 %</text>
<text x="40.0" y="356.1" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Jornal básico por día, en dólares de cada año</text>
<text x="40.0" y="379.1" font-size="12" fill="#52514e" font-weight="600" text-anchor="start" >antes de enero de 1914</text>
<rect x="40.0" y="385.1" width="163.8" height="22.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="211.8" y="401.1" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >US$2,34</text>
<text x="40.0" y="431.1" font-size="12" fill="#52514e" font-weight="600" text-anchor="start" >desde enero de 1914</text>
<rect x="40.0" y="437.1" width="350.0" height="22.0" fill="#2a78d6"/>
<text x="398.0" y="453.1" font-size="13.5" fill="#2a78d6" font-weight="700" text-anchor="start" >US$5,00 · más del doble</text>
<line x1="40.0" y1="479.1" x2="560.0" y2="479.1" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="506.1" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Para sostener 13.623 puestos, Ford contrató a 50.448 personas en</text>
<text x="40.0" y="526.3" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >un año: 3,7 por puesto. El jornal de cinco dólares fue el precio</text>
<text x="40.0" y="546.6" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >de retener gente en un trabajo muy duro.</text>
<text x="40.0" y="567.3" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Una compensación mide el costo de lo que compensa; no prueba que fuera bueno.</text>
<text x="40.0" y="591.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >[reportado — Raff y Summers 1987; archivo de The Henry Ford]. 50.448 ÷ 13.623 ≈ 3,7: una</text>
<text x="40.0" y="606.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >rotación de alrededor del 370 % [cálculo]. La última figura de cada grupo es parcial. Jornal</text>
<text x="40.0" y="622.3" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >en dólares de cada año, sin ajustar por inflación.</text>
