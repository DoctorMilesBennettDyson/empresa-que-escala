<title id="t">El jornal de cinco dólares</title>
<desc id="d">Plantilla media de 1913: 13,6 figuras de 1.000 personas; contratadas en el año: 50,4. Jornal: US$2,34 antes y US$5 desde enero de 1914.</desc>
