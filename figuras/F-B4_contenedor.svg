<text x="741.0" y="277.6" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start" >37 toneladas</text>
<line x1="40.0" y1="314.6" x2="860.0" y2="314.6" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="341.6" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Con lo que costaba cargar una tonelada suelta, el Ideal X cargó 37. McLean no inventó una máquina:</text>
<text x="40.0" y="361.8" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >cambió la unidad que se manipula.</text>
<text x="40.0" y="382.6" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Cuando el costo está en manipular la carga y no en transportarla, no se optimiza la manipulación: se cambia la unidad.</text>
<text x="40.0" y="406.3" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Costo de cargar, 1956, en dólares de ese año: US$5,83 por tonelada suelta en un barco mediano; 15,8 centavos en el Ideal X, según los contadores de</text>
<text x="40.0" y="421.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >McLean (Levinson 2006) [verificado, secundaria]. 5,83 ÷ 0,158 ≈ 37.</text>
<text x="40.0" y="443.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
