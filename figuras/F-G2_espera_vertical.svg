<title id="t">Al 100 % la espera explota</title>
<desc id="d">Curva de espera contra ocupación: 4 tiempos de atención al 80 %, 9 al 90 % y 19 al 95 %; con menos variabilidad la curva sube mucho más tarde.</desc>
