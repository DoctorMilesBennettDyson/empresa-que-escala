<text x="552.0" y="527.9" font-size="11.5" fill="#eb6834" font-weight="600" text-anchor="end" >hospitales: desde el 85 % de camas ocupadas, riesgo de no poder internar</text>
<line x1="40.0" y1="555.9" x2="560.0" y2="555.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="582.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Del 80 % al 90 % de ocupación, la espera pasa de 4 a 9 tiempos</text>
<text x="40.0" y="603.1" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >de atención; al 95 %, a 19. Hay que dejar capacidad libre a</text>
<text x="40.0" y="623.4" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >propósito.</text>
<text x="40.0" y="644.1" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Si atender un pedido lleva un día y la agenda está al 90 %, el pedido espera nueve</text>
<text x="40.0" y="661.4" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >días antes de que alguien lo toque.</text>
<text x="40.0" y="685.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Curva ocupación ÷ (1 − ocupación), para llegadas y tiempos al azar (Kingman 1961). La fórmula</text>
<text x="40.0" y="700.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >también multiplica por la variabilidad: con turnos fijos y tiempos parejos se puede trabajar</text>
<text x="40.0" y="716.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >más cerca del 100 % (la línea de trazos usa una variabilidad cuatro veces menor, ilustrativa).</text>
<text x="40.0" y="732.0" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Hospitales: Bagust, Place y Posnett, BMJ 1999 [verificado, secundaria].</text>
