<text x="517.1" y="158.9" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="end" >95 % → 19</text>
<text x="84.0" y="160.3" font-size="12.5" fill="#2a78d6" font-weight="700" text-anchor="start" >— pedidos que llegan al azar</text>
<text x="84.0" y="179.3" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >- - turnos fijos y tiempos parejos</text>
<line x1="480.3" y1="507.9" x2="552.0" y2="507.9" stroke="#eb6834" stroke-width="1.4"/>
