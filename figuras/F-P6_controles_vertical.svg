<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1031" width="600" height="1031" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Los cinco controles</title>
<desc id="d">Diagrama de decisión: G0 unidad, G1 margen, G2 curva, G3 activo y G4 caja, en orden. Cada «no» va a la salida elegida antes (matar, repetir con menos alcance o cambiar); cinco «sí» llevan a gastar en la etapa siguiente.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="600" height="1031" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Qué se revisa antes de gastar en la etapa</text>
<text x="40.0" y="64.3" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >siguiente?</text>
<text x="40.0" y="86.1" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Los cinco controles de una escalera, en orden. Cada uno se responde con sí o</text>
<text x="40.0" y="104.7" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >no, con un número y una fecha; qué hacer ante un «no» se elige antes de</text>
<text x="40.0" y="123.4" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >empezar la etapa.</text>
<rect x="80.0" y="150.5" width="320.0" height="32.0" rx="6" fill="#ecebe6" stroke="#8a8984" stroke-width="1.2"/>
<text x="240.0" y="171.5" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle" >Antes de gastar en la etapa siguiente</text>
<line x1="240.0" y1="182.5" x2="240.0" y2="206.5" stroke="#8a8984" stroke-width="1.3" marker-end="url(#fl)"/>
<path d="M40.0,238.7 L64.8,206.5 H415.2 L440.0,238.7 L415.2,270.9 H64.8 Z" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="240.0" y="225.5" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle" >G0 · Unidad</text>
<text x="240.0" y="241.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >la unidad que se repite está nombrada y su costo real,</text>
<text x="240.0" y="257.7" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >medido</text>
<line x1="440.0" y1="238.7" x2="476.0" y2="238.7" stroke="#eb6834" stroke-width="1.5"/>
<text x="446.0" y="232.7" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >no</text>
<line x1="240.0" y1="270.9" x2="240.0" y2="294.9" stroke="#8a8984" stroke-width="1.3" marker-end="url(#fl)"/>
<text x="248.0" y="286.9" font-size="12" fill="#52514e" font-weight="700" text-anchor="start" >sí</text>
<path d="M40.0,327.1 L64.8,294.9 H415.2 L440.0,327.1 L415.2,359.3 H64.8 Z" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="240.0" y="313.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle" >G1 · Margen</text>
<text x="240.0" y="329.9" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >m &gt; 0 con la hora propia al costo, medido en al menos 10</text>
<text x="240.0" y="346.1" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >unidades reales</text>
<line x1="440.0" y1="327.1" x2="476.0" y2="327.1" stroke="#eb6834" stroke-width="1.5"/>
<text x="446.0" y="321.1" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >no</text>
<line x1="240.0" y1="359.3" x2="240.0" y2="383.3" stroke="#8a8984" stroke-width="1.3" marker-end="url(#fl)"/>
<text x="248.0" y="375.3" font-size="12" fill="#52514e" font-weight="700" text-anchor="start" >sí</text>
<path d="M40.0,415.5 L64.8,383.3 H415.2 L440.0,415.5 L415.2,447.7 H64.8 Z" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="240.0" y="402.3" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle" >G2 · Curva</text>
<text x="240.0" y="418.3" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >el costo por unidad ya bajó al menos una vez al duplicar,</text>
<text x="240.0" y="434.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >con datos propios</text>
<line x1="440.0" y1="415.5" x2="476.0" y2="415.5" stroke="#eb6834" stroke-width="1.5"/>
<text x="446.0" y="409.5" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >no</text>
<line x1="240.0" y1="447.7" x2="240.0" y2="471.7" stroke="#8a8984" stroke-width="1.3" marker-end="url(#fl)"/>
<text x="248.0" y="463.7" font-size="12" fill="#52514e" font-weight="700" text-anchor="start" >sí</text>
<path d="M40.0,495.8 L58.5,471.7 H421.5 L440.0,495.8 L421.5,519.9 H58.5 Z" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="240.0" y="490.7" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle" >G3 · Activo</text>
<text x="240.0" y="506.7" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >la etapa dejó instalado un activo nombrable</text>
<line x1="440.0" y1="495.8" x2="476.0" y2="495.8" stroke="#eb6834" stroke-width="1.5"/>
<text x="446.0" y="489.8" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >no</text>
<line x1="240.0" y1="519.9" x2="240.0" y2="543.9" stroke="#8a8984" stroke-width="1.3" marker-end="url(#fl)"/>
<text x="248.0" y="535.9" font-size="12" fill="#52514e" font-weight="700" text-anchor="start" >sí</text>
<path d="M40.0,576.1 L64.8,543.9 H415.2 L440.0,576.1 L415.2,608.3 H64.8 Z" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="240.0" y="562.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle" >G4 · Caja</text>
<text x="240.0" y="578.9" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >la autonomía supera el ancho del pozo de la etapa</text>
<text x="240.0" y="595.1" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >siguiente, con 30 % de margen</text>
<line x1="440.0" y1="576.1" x2="476.0" y2="576.1" stroke="#eb6834" stroke-width="1.5"/>
<text x="446.0" y="570.1" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >no</text>
<line x1="240.0" y1="608.3" x2="240.0" y2="636.3" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#fl_az)"/>
<text x="248.0" y="626.3" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >sí, a los cinco</text>
<rect x="80.0" y="636.3" width="320.0" height="34.0" rx="6" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="240.0" y="658.3" font-size="13.5" fill="#2a78d6" font-weight="700" text-anchor="middle" >Se gasta en la etapa siguiente</text>
<line x1="476.0" y1="238.7" x2="476.0" y2="698.3" stroke="#eb6834" stroke-width="1.5" marker-end="url(#fl_na)"/>
<rect x="40.0" y="700.3" width="496.0" height="127.6" rx="6" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="52.0" y="720.8" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >A la fecha no se cumple: se ejecuta lo que se eligió al escribir el</text>
<text x="52.0" y="737.7" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >control</text>
<text x="52.0" y="758.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >· matar el proyecto (fin)</text>
<text x="52.0" y="775.2" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >· repetir la etapa con alcance reducido (vuelve arriba)</text>
<text x="52.0" y="792.4" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >· cambiar a otra cosa (fin de este proyecto)</text>
<text x="52.0" y="813.6" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >prohibido: «vemos cómo viene»</text>
<path d="M536.0,764.1 H552.0 V166.5 H402.0" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fl_na)"/>
<text x="410.0" y="160.5" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >repetir</text>
<line x1="40.0" y1="845.8" x2="560.0" y2="845.8" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="872.8" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Cinco preguntas en orden, cada una con su «no» decidido antes de</text>
<text x="40.0" y="893.1" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >empezar: sólo se gasta en la etapa siguiente si las cinco dan</text>
<text x="40.0" y="913.3" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >«sí».</text>
<text x="40.0" y="934.1" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Los controles no se saltean ni se reordenan. G2 sin G1 es la forma más común de</text>
<text x="40.0" y="951.3" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >quebrar creciendo, porque se siente como éxito hasta el último mes.</text>
<text x="40.0" y="975.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Condiciones de §6.3 y salidas de la plantilla de §6.2. Es un diagrama de decisión: no tiene</text>
<text x="40.0" y="990.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >escala ni datos.</text>
<text x="40.0" y="1012.3" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>