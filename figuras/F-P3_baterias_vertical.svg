<line x1="40.0" y1="462.3" x2="560.0" y2="462.3" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="489.3" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >El mismo paquete de 60 kWh pasó de más de US$66.000 a unos</text>
<text x="40.0" y="509.6" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >US$6.480: más de diez veces menos en quince años.</text>
<text x="40.0" y="530.3" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >En esos años la producción acumulada creció enormemente, como predice la ley de</text>
<text x="40.0" y="547.6" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Wright. Pero con producción exponencial, una simple tendencia contra el tiempo</text>
<text x="40.0" y="564.8" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >predice casi igual de bien (Nagy et al. 2013).</text>
<text x="40.0" y="588.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Precio promedio del paquete de ion-litio, BloombergNEF: 2010, más de US$1.100/kWh [reportado;</text>
<text x="40.0" y="604.2" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >la serie se reexpresa cada año en dólares constantes]; 2025, US$108/kWh [verificado, primaria</text>
<text x="40.0" y="619.8" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >— encuesta de diciembre de 2025]. El tamaño de 60 kWh es ilustrativo: 60 × 1.100 = 66.000; 60</text>
<text x="40.0" y="635.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >× 108 = 6.480 [cálculo].</text>
