<text x="161.3" y="240.1" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >1 pieza: 25 %</text>
<text x="353.3" y="144.6" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >4 piezas: 100 %; con más, el ritmo ya no sube</text>
<text x="40.0" y="292.6" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Tiempo de entrega de cada pieza, en horas</text>
<line x1="90.0" y1="438.6" x2="850.0" y2="438.6" stroke="#8a8984" stroke-width="1.2"/>
