<text x="153.3" y="415.2" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >8 h: el mínimo</text>
<text x="153.3" y="431.2" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >4 máquinas × 2 h</text>
<text x="838.0" y="299.6" font-size="12.5" fill="#eb6834" font-weight="700" text-anchor="end" >12 piezas: 24 horas, el triple</text>
<text x="153.3" y="456.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >1</text>
<text x="216.7" y="456.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >2</text>
<text x="280.0" y="456.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >3</text>
<text x="343.3" y="456.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >4</text>
<text x="406.7" y="456.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >5</text>
<text x="470.0" y="456.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >6</text>
<text x="533.3" y="456.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >7</text>
<text x="596.7" y="456.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >8</text>
<text x="660.0" y="456.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >9</text>
<text x="723.3" y="456.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >10</text>
<text x="786.7" y="456.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >11</text>
<text x="850.0" y="456.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >12</text>
<text x="470.0" y="474.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >piezas en proceso: el trabajo abierto a la vez</text>
<line x1="40.0" y1="500.6" x2="860.0" y2="500.6" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="527.6" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Con menos de 4 piezas en proceso hay máquinas paradas; con más de 4, el ritmo no sube y cada pieza</text>
<text x="40.0" y="547.8" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >espera más: con 12, tarda el triple.</text>
<text x="40.0" y="568.6" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Ley de Little: tiempo de entrega = trabajo abierto ÷ ritmo de salida. Con el mismo ritmo, más trabajo abierto es sólo más espera.</text>
<text x="40.0" y="592.3" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Hopp y Spearman, Factory Physics, 1996 [verificado, secundaria]: 25 % de la capacidad con una pieza en proceso, 100 % con cuatro. Los tiempos son un</text>
<text x="40.0" y="607.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >cálculo con la ley de Little para el caso ideal [cálculo]; con variabilidad, una línea real rinde menos y espera más.</text>
