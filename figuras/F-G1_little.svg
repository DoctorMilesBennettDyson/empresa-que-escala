<text x="83.0" y="193.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >50 %</text>
<line x1="90.0" y1="157.1" x2="850.0" y2="157.1" stroke="#e6e5e0" stroke-width="1"/>
<text x="83.0" y="161.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >75 %</text>
<line x1="90.0" y1="124.6" x2="850.0" y2="124.6" stroke="#e6e5e0" stroke-width="1"/>
<text x="83.0" y="128.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >100 %</text>
