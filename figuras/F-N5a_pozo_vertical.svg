<text x="550.0" y="176.3" font-size="11" fill="#52514e" font-weight="400" text-anchor="end" >vuelve a cero</text>
<line x1="40.0" y1="499.9" x2="560.0" y2="499.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="526.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Si la caja es menos profunda que el pozo, el plan no es un plan:</text>
<text x="40.0" y="547.1" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >con 250.000, se acaba en el mes 31, cuatro años antes del fondo.</text>
<text x="40.0" y="567.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Antes de empezar: profundidad y ancho del pozo contra la caja y los meses de</text>
<text x="40.0" y="585.1" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >autonomía.</text>
<text x="40.0" y="608.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Ilustrativo: la pérdida arranca en 10.000 por mes y baja en línea recta hasta cero en el mes</text>
<text x="40.0" y="624.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >80; profundidad = 10.000 × 80 ÷ 2. La fórmula del texto supone la pérdida constante y da el</text>
<text x="40.0" y="640.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >doble: es la cota prudente. Con retardos (§3.4) el pozo es más ancho.</text>
