<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="600" height="680" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">El pozo</title>
<desc id="d">Curva J del dinero acumulado: baja hasta 400.000 dólares en el mes 80 y vuelve a cero en el mes 160; con una caja de 250.000, el dinero se acaba en el mes 31.</desc>
