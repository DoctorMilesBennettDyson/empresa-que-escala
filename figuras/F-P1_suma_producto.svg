<text x="516.0" y="192.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >10</text>
<rect x="580.0" y="177.9" width="200.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="580.0" y="177.9" width="120.0" height="20.0" fill="#2a78d6"/>
<text x="706.0" y="192.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >6</text>
<text x="62.0" y="224.9" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start" >Vender y distribuir</text>
<text x="42.0" y="225.9" font-size="17" fill="#8a8984" font-weight="700" text-anchor="start" >×</text>
<rect x="310.0" y="209.9" width="200.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<text x="316.0" y="224.9" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start" >0</text>
<rect x="580.0" y="209.9" width="200.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="580.0" y="209.9" width="120.0" height="20.0" fill="#2a78d6"/>
<text x="706.0" y="224.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >6</text>
<text x="62.0" y="256.9" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start" >Financiar y sobrevivir</text>
<text x="42.0" y="257.9" font-size="17" fill="#8a8984" font-weight="700" text-anchor="start" >×</text>
<rect x="310.0" y="241.9" width="200.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
