<text x="62.0" y="192.9" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start" >Producir con calidad</text>
<text x="42.0" y="193.9" font-size="17" fill="#8a8984" font-weight="700" text-anchor="start" >×</text>
<rect x="310.0" y="177.9" width="200.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
