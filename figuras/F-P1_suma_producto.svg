<rect x="580.0" y="241.9" width="120.0" height="20.0" fill="#2a78d6"/>
<text x="706.0" y="256.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >6</text>
<text x="62.0" y="288.9" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start" >Organizar y aprender</text>
<text x="42.0" y="289.9" font-size="17" fill="#8a8984" font-weight="700" text-anchor="start" >×</text>
<rect x="310.0" y="273.9" width="200.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="310.0" y="273.9" width="200.0" height="20.0" fill="#2a78d6"/>
<text x="516.0" y="288.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >10</text>
<rect x="580.0" y="273.9" width="200.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="580.0" y="273.9" width="120.0" height="20.0" fill="#2a78d6"/>
<text x="706.0" y="288.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >6</text>
<line x1="40.0" y1="309.9" x2="860.0" y2="309.9" stroke="#8a8984" stroke-width="1.0"/>
<text x="62.0" y="338.9" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Sumadas</text>
<text x="310.0" y="339.9" font-size="17" fill="#52514e" font-weight="700" text-anchor="start" >50 · gana</text>
<text x="580.0" y="339.9" font-size="17" fill="#52514e" font-weight="700" text-anchor="start" >36</text>
<text x="62.0" y="372.9" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Multiplicadas</text>
<text x="310.0" y="373.9" font-size="17" fill="#eb6834" font-weight="700" text-anchor="start" >0 · todo en cero</text>
<text x="580.0" y="373.9" font-size="17" fill="#2a78d6" font-weight="700" text-anchor="start" >46.656 · gana</text>
<line x1="40.0" y1="405.9" x2="860.0" y2="405.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="432.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Sumadas, gana la brillante: 50 contra 36. Multiplicadas, gana la pareja: un solo cero deja todo en</text>
<text x="40.0" y="453.2" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >cero.</text>
<text x="40.0" y="473.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Por eso la pregunta útil no es quién tuvo más mérito, sino qué función está en cero en este negocio y quién la va a cubrir.</text>
<text x="40.0" y="497.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Puntajes ilustrativos. Las seis funciones son una agrupación didáctica [hipótesis], y que el resultado sea un producto es un supuesto de modelo, con</text>
<text x="40.0" y="513.3" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >antecedentes: Kremer (1993), la producción en la que una sola tarea mal hecha arruina el conjunto.</text>
<text x="40.0" y="534.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>