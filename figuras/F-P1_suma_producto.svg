<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 554" width="900" height="554" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Un producto, no una suma</title>
<desc id="d">Seis funciones: A tiene 10 en cinco y 0 en vender; B tiene 6 en las seis. Sumadas gana A, 50 a 36; multiplicadas gana B, 46.656 a 0.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="900" height="554" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Gana la empresa brillante con un hueco o la pareja?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Seis funciones puntuadas de 0 a 10. En una suma, lo que sobra de una compensa lo que falta de otra; en un producto, no.</text>
<text x="310.0" y="98.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >A · diez en cinco, cero en una</text>
<text x="580.0" y="98.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >B · seis en las seis</text>
<text x="62.0" y="128.9" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start" >Entender al cliente</text>
<rect x="310.0" y="113.9" width="200.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="310.0" y="113.9" width="200.0" height="20.0" fill="#2a78d6"/>
<text x="516.0" y="128.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >10</text>
<rect x="580.0" y="113.9" width="200.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="580.0" y="113.9" width="120.0" height="20.0" fill="#2a78d6"/>
<text x="706.0" y="128.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >6</text>
<text x="62.0" y="160.9" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start" >Definir el producto</text>
<text x="42.0" y="161.9" font-size="17" fill="#8a8984" font-weight="700" text-anchor="start" >×</text>
<rect x="310.0" y="145.9" width="200.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="310.0" y="145.9" width="200.0" height="20.0" fill="#2a78d6"/>
