<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 603" width="900" height="603" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">El lazo</title>
<desc id="d">Un círculo de cuatro pasos: el costo baja, el precio baja, la demanda sube, el volumen crece, con t, ε y b en las flechas. Al lado, la suma 1 + G + G² que converge a 2 con G = 0,5, a 5 con G = 0,8 y se desboca con G mayor que 1.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="900" height="603" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿El volante gira solo, o hay que empujarlo para siempre?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Costo, precio, demanda y volumen: un número en cada flecha. Su producto, G, decide.</text>
<path d="M356.3,153.8 A132,132 0 0 1 395.5,217.8" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#fl_az)"/>
<text x="394.2" y="164.6" font-size="17" fill="#2a78d6" font-weight="700" text-anchor="start" >t</text>
<text x="394.2" y="180.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >traslado</text>
<text x="394.2" y="194.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >al precio</text>
<path d="M395.5,286.1 A132,132 0 0 1 356.3,350.0" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#fl_az)"/>
<text x="394.2" y="345.3" font-size="17" fill="#2a78d6" font-weight="700" text-anchor="start" >ε</text>
<text x="394.2" y="361.3" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >elasticidad</text>
<text x="394.2" y="375.3" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >de la demanda</text>
<path d="M179.7,350.0 A132,132 0 0 1 140.5,286.1" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#fl_az)"/>
<text x="141.8" y="361.3" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="end" >se vende</text>
<text x="141.8" y="375.3" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="end" >lo pedido</text>
<path d="M140.5,217.8 A132,132 0 0 1 179.7,153.8" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#fl_az)"/>
<text x="141.8" y="164.6" font-size="17" fill="#2a78d6" font-weight="700" text-anchor="end" >b</text>
<text x="141.8" y="180.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="end" >aprendizaje:</text>
<text x="141.8" y="194.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="end" >r = 20 % → 0,32</text>
<rect x="215.1" y="103.9" width="105.8" height="32.0" rx="16" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="268.0" y="124.4" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle" >el costo baja</text>
<rect x="343.8" y="235.9" width="112.5" height="32.0" rx="16" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="400.0" y="256.4" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle" >el precio baja</text>
<rect x="208.4" y="367.9" width="119.2" height="32.0" rx="16" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="268.0" y="388.4" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle" >la demanda sube</text>
<rect x="73.0" y="235.9" width="126.0" height="32.0" rx="16" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="136.0" y="256.4" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle" >el volumen crece</text>
<text x="268.0" y="249.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >G = t × ε × b</text>
<text x="268.0" y="268.9" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >la ganancia del lazo</text>
<text x="530.0" y="109.9" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Una baja inicial de 1 termina valiendo</text>
<text x="530.0" y="127.9" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >1 + G + G² + G³ + …</text>
<text x="530.0" y="162.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >G = 0,5</text>
<text x="860.0" y="162.9" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="end" >→ × 2</text>
<rect x="530.0" y="169.9" width="50.0" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="580.0" y="169.9" width="25.0" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="605.0" y="169.9" width="12.5" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="617.5" y="169.9" width="6.2" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="623.8" y="169.9" width="3.1" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="626.9" y="169.9" width="1.6" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<line x1="630.0" y1="165.9" x2="630.0" y2="197.9" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="530.0" y="222.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >G = 0,8</text>
<text x="860.0" y="222.9" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="end" >→ × 5</text>
<rect x="530.0" y="229.9" width="50.0" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="580.0" y="229.9" width="40.0" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="620.0" y="229.9" width="32.0" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="652.0" y="229.9" width="25.6" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="677.6" y="229.9" width="20.5" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="698.1" y="229.9" width="16.4" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="714.5" y="229.9" width="13.1" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="727.6" y="229.9" width="10.5" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="738.1" y="229.9" width="8.4" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="746.4" y="229.9" width="6.7" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="753.2" y="229.9" width="5.4" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="758.5" y="229.9" width="4.3" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="762.8" y="229.9" width="3.4" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="766.3" y="229.9" width="2.7" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="769.0" y="229.9" width="2.2" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="771.2" y="229.9" width="1.8" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="773.0" y="229.9" width="1.4" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="774.4" y="229.9" width="1.1" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="775.5" y="229.9" width="0.9" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<line x1="780.0" y1="225.9" x2="780.0" y2="257.9" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="530.0" y="282.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >G = 1,1</text>
<text x="860.0" y="282.9" font-size="13" fill="#eb6834" font-weight="700" text-anchor="end" >se desboca</text>
<rect x="530.0" y="289.9" width="50.0" height="24" fill="#eb6834" stroke="#fcfcfb" stroke-width="1"/>
<rect x="580.0" y="289.9" width="55.0" height="24" fill="#fbd9ca" stroke="#fcfcfb" stroke-width="1"/>
<rect x="635.0" y="289.9" width="60.5" height="24" fill="#eb6834" stroke="#fcfcfb" stroke-width="1"/>
<rect x="695.5" y="289.9" width="66.6" height="24" fill="#fbd9ca" stroke="#fcfcfb" stroke-width="1"/>
<rect x="762.1" y="289.9" width="67.9" height="24" fill="#eb6834" stroke="#fcfcfb" stroke-width="1"/>
<line x1="832.0" y1="301.9" x2="860.0" y2="301.9" stroke="#eb6834" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#fl_na)"/>
<text x="530.0" y="335.4" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >Cada tramo es G veces el anterior. Si G &lt; 1, la suma</text>
<text x="530.0" y="351.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >tiene techo: 1 ÷ (1 − G). Si G ≥ 1, crece hasta que algo</text>
<text x="530.0" y="366.5" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >lo frena.</text>
<line x1="40.0" y1="437.9" x2="860.0" y2="437.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="464.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >El volante es una suma: con G = 0,5 una baja de costo vale el doble; con 0,8, cinco veces; con G ≥ 1</text>
<text x="40.0" y="485.2" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >se desboca hasta que el mercado, la capacidad o la caja lo frenan.</text>
<text x="40.0" y="505.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Ejemplo del texto: t = 1, ε = 1,5 y b = 0,32 dan G ≈ 0,48: útil, no milagroso. Si no se puede poner un número en al menos dos</text>
<text x="40.0" y="523.2" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >flechas, no es un lazo: es un dibujo.</text>
<text x="40.0" y="546.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Modelo simplificado de largo plazo, sin retardos ni saturación. Con r = 20 % (b ≈ 0,32) y t = 1, G pasa de 1 sólo si ε &gt; 3, cosa que pasa pocas veces</text>
<text x="40.0" y="562.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >y dura poco.</text>
<text x="40.0" y="584.2" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>