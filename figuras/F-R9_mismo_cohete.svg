<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" width="900" height="525" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">El mismo cohete, cuatro precios</title>
<desc id="d">Costo de desarrollo del Falcon 9 según cuatro formas de contratarlo (NASA 2011): 3.977, 1.695 y 443 millones de dólares de 2010 (1.383 con los mismos datos a costo más honorario), contra unos 300 declarados por SpaceX; y un actuador cotizado en 120.000 dólares que terminó costando 3.900.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="900" height="525" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Cuánto cuesta un cohete? Depende de quién paga si el costo sube.</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Tres estimaciones de la NASA y el dato de SpaceX para el mismo Falcon 9: lo que más cambia es cómo se contrata.</text>
<text x="40.0" y="99.9" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >A · Desarrollar el Falcon 9, en millones de US$</text>
<text x="40.0" y="116.9" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >escala logarítmica (cada marca vale 10 veces la anterior) · dólares de 2010</text>
<line x1="275.0" y1="137.9" x2="275.0" y2="339.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="275.0" y="355.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >100</text>
<line x1="338.2" y1="137.9" x2="338.2" y2="339.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="338.2" y="355.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >300</text>
<line x1="407.5" y1="137.9" x2="407.5" y2="339.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="407.5" y="355.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >1.000</text>
<line x1="470.7" y1="137.9" x2="470.7" y2="203.5" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="470.7" y1="221.2" x2="470.7" y2="264.1" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="470.7" y1="291.7" x2="470.7" y2="339.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="470.7" y="355.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >3.000</text>
<line x1="540.0" y1="137.9" x2="540.0" y2="264.1" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="540.0" y1="279.7" x2="540.0" y2="339.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="540.0" y="355.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >10.000</text>
<line x1="275.0" y1="137.9" x2="275.0" y2="339.9" stroke="#8a8984" stroke-width="1.0"/>
<text x="265.0" y="156.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end" >Inicial · cultura NASA</text>
<text x="265.0" y="171.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="end" >costo más honorario</text>
<rect x="275.0" y="143.9" width="211.9" height="30.0" fill="#eb6834"/>
<text x="494.9" y="163.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >3.977</text>
<text x="265.0" y="208.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end" >Inicial · enfoque comercial</text>
<text x="265.0" y="223.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="end" >también costo más honorario</text>
<rect x="275.0" y="195.9" width="162.9" height="30.0" fill="url(#rayas)" stroke="#eb6834" stroke-width="1.5"/>
<text x="445.9" y="215.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >1.695</text>
<text x="265.0" y="260.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end" >Corregida · precio fijo</text>
<text x="265.0" y="275.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="end" >sin honorario, soporte ni imprevistos</text>
<rect x="275.0" y="247.9" width="85.6" height="30.0" fill="#cde2fb" stroke="#2a78d6" stroke-width="2" stroke-dasharray="5 4"/>
<text x="368.6" y="267.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >443</text>
<line x1="426.2" y1="244.9" x2="426.2" y2="280.9" stroke="#eb6834" stroke-width="2.5" stroke-dasharray="3 2"/>
<text x="432.2" y="260.9" font-size="11.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >1.383</text>
<text x="432.2" y="274.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" >mismos datos, a costo</text>
<text x="432.2" y="286.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" >más honorario</text>
<text x="265.0" y="312.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end" >Declarado por SpaceX</text>
<text x="265.0" y="327.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="end" >sólo Falcon 9; con Falcon 1, ≈ 390</text>
<rect x="275.0" y="299.9" width="63.2" height="30.0" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2.25"/>
<text x="346.2" y="319.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >≈ 300</text>
<text x="640.0" y="99.9" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >B · Actuador del Falcon 1, en US$</text>
<text x="640.0" y="116.9" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >escala logarítmica, en dólares</text>
<line x1="686.0" y1="339.9" x2="860.0" y2="339.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="680.0" y="343.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >1.000</text>
<line x1="686.0" y1="257.4" x2="860.0" y2="257.4" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="680.0" y="261.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >10.000</text>
<line x1="686.0" y1="174.8" x2="860.0" y2="174.8" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="680.0" y="178.8" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >100.000</text>
<line x1="686.0" y1="339.9" x2="860.0" y2="339.9" stroke="#8a8984" stroke-width="1.0"/>
<rect x="698.8" y="168.2" width="32.5" height="171.7" fill="#eb6834"/>
<text x="715.0" y="161.2" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" >120.000</text>
<text x="715.0" y="355.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" >cotizado</text>
<rect x="756.8" y="282.2" width="32.5" height="57.7" fill="#cde2fb" stroke="#2a78d6" stroke-width="2" stroke-dasharray="5 4"/>
<text x="773.0" y="275.2" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" >5.000</text>
<text x="773.0" y="355.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" >tope fijado</text>
<rect x="814.8" y="291.1" width="32.5" height="48.8" fill="#2a78d6"/>
<text x="831.0" y="284.1" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" >3.900</text>
<text x="831.0" y="355.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" >costo final</text>
<line x1="40.0" y1="379.9" x2="860.0" y2="379.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="406.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Con los mismos datos, cambiar sólo el contrato divide el costo por 3. De punta a punta, por 13.</text>
<text x="40.0" y="427.7" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >SpaceX estima que cada dólar que sale de la empresa cuesta entre 3 y 5, por los gastos y la ganancia de los subcontratistas. El</text>
<text x="40.0" y="444.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >actuador: un proveedor cotizó 120.000; hecho en casa, en nueve meses, costó 3.900 (factor 31).</text>
<text x="40.0" y="468.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >NASA, agosto de 2011 (modelo NAFCOM). La NASA no analizó en detalle de dónde sale la diferencia con el costo real. Barra hueca: dato de la empresa,</text>
<text x="40.0" y="484.3" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >no del modelo; la NASA dice haberlo verificado (NASA 2010, citado por Zapata 2017). Actuador: Vance 2015, una sola fuente.</text>
<text x="40.0" y="505.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>