<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 904" width="600" height="904" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">El mismo cohete, cuatro precios</title>
<desc id="d">Costo de desarrollo del Falcon 9 según cuatro formas de contratarlo (NASA 2011): 3.977, 1.695 y 443 millones de dólares de 2010 (1.383 con los mismos datos a costo más honorario), contra unos 300 declarados por SpaceX; y un actuador cotizado en 120.000 dólares que terminó costando 3.900.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="600" height="904" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Cuánto cuesta un cohete? Depende de quién</text>
<text x="40.0" y="64.3" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >paga si el costo sube.</text>
<text x="40.0" y="86.1" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Tres estimaciones de la NASA y el dato de SpaceX para el mismo Falcon 9: lo</text>
<text x="40.0" y="104.7" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >que más cambia es cómo se contrata.</text>
<text x="40.0" y="145.9" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >A · Desarrollar el Falcon 9, en millones de US$</text>
<text x="40.0" y="162.9" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >escala logarítmica (cada marca vale 10 veces la anterior) · dólares de 2010</text>
<line x1="268.0" y1="183.9" x2="268.0" y2="385.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="268.0" y="401.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >100</text>
<line x1="321.0" y1="183.9" x2="321.0" y2="385.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="321.0" y="401.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >300</text>
<line x1="379.0" y1="183.9" x2="379.0" y2="385.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="379.0" y="401.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >1.000</text>
<line x1="432.0" y1="183.9" x2="432.0" y2="249.5" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="432.0" y1="267.1" x2="432.0" y2="295.7" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="432.0" y1="337.6" x2="432.0" y2="385.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="432.0" y="401.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >3.000</text>
<line x1="490.0" y1="183.9" x2="490.0" y2="197.5" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="490.0" y1="215.1" x2="490.0" y2="310.1" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="490.0" y1="325.6" x2="490.0" y2="385.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="490.0" y="401.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >10.000</text>
<line x1="268.0" y1="183.9" x2="268.0" y2="385.9" stroke="#8a8984" stroke-width="1.0"/>
<text x="258.0" y="202.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end" >Inicial · cultura NASA</text>
<text x="258.0" y="217.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="end" >costo más honorario</text>
<rect x="268.0" y="189.9" width="177.6" height="30.0" fill="#eb6834"/>
<text x="453.6" y="209.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >3.977</text>
<text x="258.0" y="254.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end" >Inicial · enfoque comercial</text>
<text x="258.0" y="269.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="end" >también costo más honorario</text>
<rect x="268.0" y="241.9" width="136.4" height="30.0" fill="url(#rayas)" stroke="#eb6834" stroke-width="1.5"/>
<text x="412.4" y="261.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >1.695</text>
<text x="258.0" y="306.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end" >Corregida · precio fijo</text>
<text x="258.0" y="321.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="end" >sin honorario, soporte ni imprevistos</text>
<rect x="268.0" y="293.9" width="71.8" height="30.0" fill="#cde2fb" stroke="#2a78d6" stroke-width="2" stroke-dasharray="5 4"/>
<text x="347.8" y="313.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >443</text>
<line x1="394.6" y1="290.9" x2="394.6" y2="326.9" stroke="#eb6834" stroke-width="2.5" stroke-dasharray="3 2"/>
<text x="400.6" y="306.9" font-size="11.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >1.383</text>
<text x="400.6" y="320.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" >mismos datos, a costo</text>
<text x="400.6" y="332.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" >más honorario</text>
<text x="258.0" y="358.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end" >Declarado por SpaceX</text>
<text x="258.0" y="373.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="end" >sólo Falcon 9; con Falcon 1, ≈ 390</text>
<rect x="268.0" y="345.9" width="53.0" height="30.0" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2.25"/>
<text x="329.0" y="365.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >≈ 300</text>
<text x="40.0" y="445.9" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >B · Actuador del Falcon 1, en US$</text>
<text x="40.0" y="462.9" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >escala logarítmica, en dólares</text>
<line x1="86.0" y1="665.9" x2="440.0" y2="665.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="80.0" y="669.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >1.000</text>
<line x1="86.0" y1="592.0" x2="440.0" y2="592.0" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="80.0" y="596.0" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >10.000</text>
<line x1="86.0" y1="518.1" x2="440.0" y2="518.1" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="80.0" y="522.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >100.000</text>
<line x1="86.0" y1="665.9" x2="440.0" y2="665.9" stroke="#8a8984" stroke-width="1.0"/>
<rect x="118.0" y="512.3" width="54.0" height="153.6" fill="#eb6834"/>
<text x="145.0" y="505.3" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" >120.000</text>
<text x="145.0" y="681.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" >cotizado</text>
<rect x="236.0" y="614.2" width="54.0" height="51.6" fill="#cde2fb" stroke="#2a78d6" stroke-width="2" stroke-dasharray="5 4"/>
<text x="263.0" y="607.2" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" >5.000</text>
<text x="263.0" y="681.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" >tope fijado</text>
<rect x="354.0" y="622.2" width="54.0" height="43.7" fill="#2a78d6"/>
<text x="381.0" y="615.2" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle" >3.900</text>
<text x="381.0" y="681.9" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle" >costo final</text>
<line x1="40.0" y1="705.9" x2="560.0" y2="705.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="732.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Con los mismos datos, cambiar sólo el contrato divide el costo</text>
<text x="40.0" y="753.1" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >por 3. De punta a punta, por 13.</text>
<text x="40.0" y="773.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >SpaceX estima que cada dólar que sale de la empresa cuesta entre 3 y 5, por los</text>
<text x="40.0" y="791.1" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >gastos y la ganancia de los subcontratistas. El actuador: un proveedor cotizó</text>
<text x="40.0" y="808.4" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >120.000; hecho en casa, en nueve meses, costó 3.900 (factor 31).</text>
<text x="40.0" y="832.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >NASA, agosto de 2011 (modelo NAFCOM). La NASA no analizó en detalle de dónde sale la</text>
<text x="40.0" y="847.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >diferencia con el costo real. Barra hueca: dato de la empresa, no del modelo; la NASA dice</text>
<text x="40.0" y="863.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >haberlo verificado (NASA 2010, citado por Zapata 2017). Actuador: Vance 2015, una sola fuente.</text>
<text x="40.0" y="885.0" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>