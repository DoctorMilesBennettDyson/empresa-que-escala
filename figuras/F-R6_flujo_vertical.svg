<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 633" width="600" height="633" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Medir el flujo</title>
<desc id="d">Un pedido de unos 7 días en una barra: tres franjas azules finas (corte, soldadura, pintura; 2 h 15 min en total) entre esperas grises. Cociente: 1,3 %.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="600" height="633" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Dónde se va el tiempo de un pedido?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Un pedido en un taller, desde que entra hasta que se retira (ejemplo</text>
<text x="40.0" y="77.4" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >ilustrativo). Azul: los pasos que cambian algo que el cliente pagaría. Gris:</text>
<text x="40.0" y="96.1" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >espera.</text>
<text x="40.0" y="136.2" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >El recorrido, a escala: el ancho de cada tramo es su duración</text>
<rect x="40.0" y="189.2" width="219.9" height="34.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="150.0" y="241.2" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle" >en cola</text>
<text x="150.0" y="256.2" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >3 días</text>
<rect x="259.9" y="189.2" width="3.0" height="34.0" fill="#2a78d6"/>
<line x1="261.1" y1="186.2" x2="261.1" y2="177.2" stroke="#2a78d6" stroke-width="1.2"/>
<text x="261.1" y="173.2" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="middle" >corte · 45 min</text>
<rect x="262.2" y="189.2" width="73.3" height="34.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="298.9" y="241.2" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle" >espera</text>
<text x="298.9" y="256.2" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >1 día</text>
<rect x="335.5" y="189.2" width="3.1" height="34.0" fill="#2a78d6"/>
<line x1="337.0" y1="186.2" x2="337.0" y2="159.2" stroke="#2a78d6" stroke-width="1.2"/>
<text x="337.0" y="155.2" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="middle" >soldadura · 1 h</text>
<rect x="338.6" y="189.2" width="146.6" height="34.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="411.9" y="241.2" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle" >espera pintura</text>
<text x="411.9" y="256.2" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >2 días</text>
<rect x="485.2" y="189.2" width="3.0" height="34.0" fill="#2a78d6"/>
<line x1="485.9" y1="186.2" x2="485.9" y2="177.2" stroke="#2a78d6" stroke-width="1.2"/>
<text x="485.9" y="173.2" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="middle" >pintura · 30 min</text>
<rect x="486.7" y="189.2" width="73.3" height="34.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="523.3" y="241.2" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle" >espera retiro</text>
<text x="523.3" y="256.2" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >1 día</text>
<text x="40.0" y="302.2" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Lo que se suele medir: la fabricación</text>
<rect x="40.0" y="311.2" width="6.9" height="24.0" fill="#2a78d6"/>
<text x="56.9" y="328.2" font-size="13.5" fill="#2a78d6" font-weight="700" text-anchor="start" >2 h 15 min</text>
<text x="40.0" y="368.2" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Lo que espera el cliente</text>
<rect x="40.0" y="377.2" width="520.0" height="24.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="560.0" y="421.2" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="end" >unos 7 días</text>
<text x="40.0" y="445.2" font-size="14" fill="#2a78d6" font-weight="700" text-anchor="start" >tiempo que agrega valor ÷ tiempo total = 1,3 %</text>
<line x1="40.0" y1="468.1" x2="560.0" y2="468.1" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="495.1" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >De unos 7 días, el pedido pasa 2 horas y cuarto en pasos que</text>
<text x="40.0" y="515.3" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >agregan valor: el 1,3 % del tiempo. El resto es espera.</text>
<text x="40.0" y="536.1" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Medir sólo la fabricación esconde lo principal: en la mayoría de los procesos, la</text>
<text x="40.0" y="553.3" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >espera es la mayor parte.</text>
<text x="40.0" y="577.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Ejemplo ilustrativo, no un dato medido: los tiempos están elegidos para mostrar la receta R6.</text>
<text x="40.0" y="592.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Con datos reales, el cociente se calcula igual: tiempo que agrega valor ÷ tiempo total.</text>
<text x="40.0" y="614.3" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>