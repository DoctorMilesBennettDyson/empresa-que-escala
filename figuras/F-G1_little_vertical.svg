<circle cx="550.0" cy="151.9" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="136.3" y="282.4" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >1 pieza: 25 %</text>
<text x="253.3" y="171.9" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >4 piezas: 100 %; con más, el ritmo ya no sube</text>
<text x="40.0" y="339.9" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Tiempo de entrega de cada pieza, en horas</text>
<line x1="90.0" y1="505.9" x2="550.0" y2="505.9" stroke="#8a8984" stroke-width="1.2"/>
