<circle cx="550.0" cy="355.9" r="4.5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="128.3" y="475.9" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >8 h: el mínimo</text>
<text x="128.3" y="491.9" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >4 máquinas × 2 h</text>
<text x="538.0" y="346.9" font-size="12.5" fill="#eb6834" font-weight="700" text-anchor="end" >12 piezas: 24 h, el triple</text>
<text x="128.3" y="523.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >1</text>
<text x="166.7" y="523.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >2</text>
<text x="205.0" y="523.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >3</text>
<text x="243.3" y="523.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >4</text>
<text x="281.7" y="523.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >5</text>
<text x="320.0" y="523.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >6</text>
<text x="358.3" y="523.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >7</text>
<text x="396.7" y="523.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >8</text>
<text x="435.0" y="523.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >9</text>
<text x="473.3" y="523.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >10</text>
<text x="511.7" y="523.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >11</text>
<text x="550.0" y="523.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >12</text>
<text x="320.0" y="541.9" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >piezas en proceso: el trabajo abierto a la vez</text>
<line x1="40.0" y1="567.9" x2="560.0" y2="567.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="594.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Con menos de 4 piezas en proceso hay máquinas paradas; con más</text>
<text x="40.0" y="615.1" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >de 4, el ritmo no sube y cada pieza espera más: con 12, tarda el</text>
<text x="40.0" y="635.4" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >triple.</text>
<text x="40.0" y="656.1" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Ley de Little: tiempo de entrega = trabajo abierto ÷ ritmo de salida. Con el mismo</text>
<text x="40.0" y="673.4" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >ritmo, más trabajo abierto es sólo más espera.</text>
<text x="40.0" y="697.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Hopp y Spearman, Factory Physics, 1996 [verificado, secundaria]: 25 % de la capacidad con una</text>
<text x="40.0" y="712.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >pieza en proceso, 100 % con cuatro. Los tiempos son un cálculo con la ley de Little para el</text>
<text x="40.0" y="728.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >caso ideal [cálculo]; con variabilidad, una línea real rinde menos y espera más.</text>
