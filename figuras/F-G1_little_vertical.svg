<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 769" width="600" height="769" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">La ley de Little</title>
<desc id="d">Arriba, el ritmo sube 25 % por pieza hasta 4 piezas y después queda en 100 %. Abajo, el tiempo de entrega queda en 8 horas hasta 4 piezas y sube 2 horas por pieza: 24 horas con 12.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="600" height="769" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Cuántos trabajos conviene tener abiertos a</text>
<text x="40.0" y="64.3" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >la vez?</text>
<text x="40.0" y="86.1" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Una línea de 4 máquinas en serie, de 2 horas cada una (el ejemplo de Hopp y</text>
<text x="40.0" y="104.7" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Spearman), en el caso ideal, sin variabilidad.</text>
<text x="40.0" y="135.9" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Ritmo de salida, en % de la capacidad</text>
<line x1="90.0" y1="301.9" x2="550.0" y2="301.9" stroke="#8a8984" stroke-width="1.2"/>
<text x="83.0" y="305.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >0 %</text>
