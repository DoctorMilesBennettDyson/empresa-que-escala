<text x="83.0" y="409.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >16 h</text>
<line x1="90.0" y1="355.9" x2="550.0" y2="355.9" stroke="#e6e5e0" stroke-width="1"/>
<text x="83.0" y="359.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >24 h</text>
