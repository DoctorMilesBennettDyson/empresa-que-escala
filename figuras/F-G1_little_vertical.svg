<text x="83.0" y="268.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >25 %</text>
<line x1="90.0" y1="226.9" x2="550.0" y2="226.9" stroke="#e6e5e0" stroke-width="1"/>
<text x="83.0" y="230.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >50 %</text>
<line x1="90.0" y1="189.4" x2="550.0" y2="189.4" stroke="#e6e5e0" stroke-width="1"/>
<text x="83.0" y="193.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >75 %</text>
<line x1="90.0" y1="151.9" x2="550.0" y2="151.9" stroke="#e6e5e0" stroke-width="1"/>
<text x="83.0" y="155.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="end" >100 %</text>
<line x1="243.3" y1="147.9" x2="243.3" y2="301.9" stroke="#2a78d6" stroke-width="1.3" stroke-dasharray="4 3"/>
