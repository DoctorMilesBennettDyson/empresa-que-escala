<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 762" width="600" height="762" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Un producto, no una suma</title>
<desc id="d">Seis funciones: A tiene 10 en cinco y 0 en vender; B tiene 6 en las seis. Sumadas gana A, 50 a 36; multiplicadas gana B, 46.656 a 0.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="600" height="762" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Gana la empresa brillante con un hueco o la</text>
<text x="40.0" y="64.3" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >pareja?</text>
<text x="40.0" y="86.1" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Seis funciones puntuadas de 0 a 10. En una suma, lo que sobra de una compensa</text>
<text x="40.0" y="104.7" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >lo que falta de otra; en un producto, no.</text>
<text x="64.0" y="144.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >A · diez en cinco, cero en una</text>
<text x="317.0" y="144.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >B · seis en las seis</text>
<text x="64.0" y="172.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >Entender al cliente</text>
<rect x="64.0" y="178.9" width="213.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="64.0" y="178.9" width="213.0" height="20.0" fill="#2a78d6"/>
<text x="283.0" y="193.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >10</text>
<rect x="317.0" y="178.9" width="213.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="317.0" y="178.9" width="127.8" height="20.0" fill="#2a78d6"/>
<text x="450.8" y="193.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >6</text>
<text x="64.0" y="219.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >Definir el producto</text>
<text x="42.0" y="222.9" font-size="17" fill="#8a8984" font-weight="700" text-anchor="start" >×</text>
<rect x="64.0" y="225.9" width="213.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="64.0" y="225.9" width="213.0" height="20.0" fill="#2a78d6"/>
<text x="283.0" y="240.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >10</text>
<rect x="317.0" y="225.9" width="213.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="317.0" y="225.9" width="127.8" height="20.0" fill="#2a78d6"/>
<text x="450.8" y="240.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >6</text>
<text x="64.0" y="266.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >Producir con calidad</text>
<text x="42.0" y="269.9" font-size="17" fill="#8a8984" font-weight="700" text-anchor="start" >×</text>
<rect x="64.0" y="272.9" width="213.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="64.0" y="272.9" width="213.0" height="20.0" fill="#2a78d6"/>
<text x="283.0" y="287.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >10</text>
<rect x="317.0" y="272.9" width="213.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="317.0" y="272.9" width="127.8" height="20.0" fill="#2a78d6"/>
<text x="450.8" y="287.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >6</text>
<text x="64.0" y="313.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >Vender y distribuir</text>
<text x="42.0" y="316.9" font-size="17" fill="#8a8984" font-weight="700" text-anchor="start" >×</text>
<rect x="64.0" y="319.9" width="213.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<text x="70.0" y="334.9" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start" >0</text>
<rect x="317.0" y="319.9" width="213.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="317.0" y="319.9" width="127.8" height="20.0" fill="#2a78d6"/>
<text x="450.8" y="334.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >6</text>
<text x="64.0" y="360.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >Financiar y sobrevivir</text>
<text x="42.0" y="363.9" font-size="17" fill="#8a8984" font-weight="700" text-anchor="start" >×</text>
<rect x="64.0" y="366.9" width="213.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="64.0" y="366.9" width="213.0" height="20.0" fill="#2a78d6"/>
<text x="283.0" y="381.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >10</text>
<rect x="317.0" y="366.9" width="213.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="317.0" y="366.9" width="127.8" height="20.0" fill="#2a78d6"/>
<text x="450.8" y="381.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >6</text>
<text x="64.0" y="407.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >Organizar y aprender</text>
<text x="42.0" y="410.9" font-size="17" fill="#8a8984" font-weight="700" text-anchor="start" >×</text>
<rect x="64.0" y="413.9" width="213.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="64.0" y="413.9" width="213.0" height="20.0" fill="#2a78d6"/>
<text x="283.0" y="428.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >10</text>
<rect x="317.0" y="413.9" width="213.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="317.0" y="413.9" width="127.8" height="20.0" fill="#2a78d6"/>
<text x="450.8" y="428.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >6</text>
<line x1="40.0" y1="445.9" x2="560.0" y2="445.9" stroke="#8a8984" stroke-width="1.0"/>
<text x="64.0" y="470.9" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Sumadas</text>
<text x="64.0" y="495.9" font-size="17" fill="#52514e" font-weight="700" text-anchor="start" >50 · gana</text>
<text x="317.0" y="495.9" font-size="17" fill="#52514e" font-weight="700" text-anchor="start" >36</text>
<text x="64.0" y="524.9" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Multiplicadas</text>
<text x="64.0" y="549.9" font-size="17" fill="#eb6834" font-weight="700" text-anchor="start" >0 · todo en cero</text>
<text x="317.0" y="549.9" font-size="17" fill="#2a78d6" font-weight="700" text-anchor="start" >46.656 · gana</text>
<line x1="40.0" y1="581.9" x2="560.0" y2="581.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="608.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Sumadas, gana la brillante: 50 contra 36. Multiplicadas, gana la</text>
<text x="40.0" y="629.1" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >pareja: un solo cero deja todo en cero.</text>
<text x="40.0" y="649.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Por eso la pregunta útil no es quién tuvo más mérito, sino qué función está en cero</text>
<text x="40.0" y="667.1" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >en este negocio y quién la va a cubrir.</text>
<text x="40.0" y="690.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Puntajes ilustrativos. Las seis funciones son una agrupación didáctica [hipótesis], y que el</text>
<text x="40.0" y="706.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >resultado sea un producto es un supuesto de modelo, con antecedentes: Kremer (1993), la</text>
<text x="40.0" y="722.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >producción en la que una sola tarea mal hecha arruina el conjunto.</text>
<text x="40.0" y="743.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>