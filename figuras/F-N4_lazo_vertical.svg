<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 943" width="600" height="943" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">El lazo</title>
<desc id="d">Un círculo de cuatro pasos: el costo baja, el precio baja, la demanda sube, el volumen crece, con t, ε y b en las flechas. Al lado, la suma 1 + G + G² que converge a 2 con G = 0,5, a 5 con G = 0,8 y se desboca con G mayor que 1.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="600" height="943" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿El volante gira solo, o hay que empujarlo</text>
<text x="40.0" y="64.3" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >para siempre?</text>
<text x="40.0" y="86.1" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Costo, precio, demanda y volumen: un número en cada flecha. Su producto, G,</text>
<text x="40.0" y="104.7" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >decide.</text>
<path d="M387.0,199.3 A130,130 0 0 1 425.6,262.2" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#fl_az)"/>
<text x="424.5" y="209.6" font-size="17" fill="#2a78d6" font-weight="700" text-anchor="start" >t</text>
<text x="424.5" y="225.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >traslado</text>
<text x="424.5" y="239.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >al precio</text>
<path d="M425.6,329.5 A130,130 0 0 1 387.0,392.5" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#fl_az)"/>
<text x="424.5" y="388.1" font-size="17" fill="#2a78d6" font-weight="700" text-anchor="start" >ε</text>
<text x="424.5" y="404.1" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >elasticidad</text>
<text x="424.5" y="418.1" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >de la demanda</text>
<path d="M213.0,392.5 A130,130 0 0 1 174.4,329.5" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#fl_az)"/>
<text x="175.5" y="404.1" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="end" >se vende</text>
<text x="175.5" y="418.1" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="end" >lo pedido</text>
<path d="M174.4,262.2 A130,130 0 0 1 213.0,199.3" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#fl_az)"/>
<text x="175.5" y="209.6" font-size="17" fill="#2a78d6" font-weight="700" text-anchor="end" >b</text>
<text x="175.5" y="225.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="end" >aprendizaje:</text>
<text x="175.5" y="239.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="end" >r = 20 % → 0,32</text>
<rect x="247.1" y="149.9" width="105.8" height="32.0" rx="16" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="300.0" y="170.4" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle" >el costo baja</text>
<rect x="373.8" y="279.9" width="112.5" height="32.0" rx="16" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="430.0" y="300.4" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle" >el precio baja</text>
<rect x="240.4" y="409.9" width="119.2" height="32.0" rx="16" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="300.0" y="430.4" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle" >la demanda sube</text>
<rect x="107.0" y="279.9" width="126.0" height="32.0" rx="16" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="170.0" y="300.4" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle" >el volumen crece</text>
<text x="300.0" y="293.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >G = t × ε × b</text>
<text x="300.0" y="312.9" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >la ganancia del lazo</text>
<text x="40.0" y="485.9" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Una baja inicial de 1 termina valiendo</text>
<text x="40.0" y="503.9" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >1 + G + G² + G³ + …</text>
<text x="40.0" y="538.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >G = 0,5</text>
<text x="560.0" y="538.9" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="end" >→ × 2</text>
<rect x="40.0" y="545.9" width="58.0" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="98.0" y="545.9" width="29.0" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="127.0" y="545.9" width="14.5" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="141.5" y="545.9" width="7.2" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="148.8" y="545.9" width="3.6" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="152.4" y="545.9" width="1.8" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="154.2" y="545.9" width="0.9" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<line x1="156.0" y1="541.9" x2="156.0" y2="573.9" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="40.0" y="598.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >G = 0,8</text>
<text x="560.0" y="598.9" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="end" >→ × 5</text>
<rect x="40.0" y="605.9" width="58.0" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="98.0" y="605.9" width="46.4" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="144.4" y="605.9" width="37.1" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="181.5" y="605.9" width="29.7" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="211.2" y="605.9" width="23.8" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="235.0" y="605.9" width="19.0" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="254.0" y="605.9" width="15.2" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="269.2" y="605.9" width="12.2" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="281.3" y="605.9" width="9.7" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="291.1" y="605.9" width="7.8" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="298.9" y="605.9" width="6.2" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="305.1" y="605.9" width="5.0" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="310.1" y="605.9" width="4.0" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="314.1" y="605.9" width="3.2" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="317.2" y="605.9" width="2.6" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="319.8" y="605.9" width="2.0" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="321.8" y="605.9" width="1.6" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="323.5" y="605.9" width="1.3" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<rect x="324.8" y="605.9" width="1.0" height="24" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1"/>
<rect x="325.8" y="605.9" width="0.8" height="24" fill="#cde2fb" stroke="#fcfcfb" stroke-width="1"/>
<line x1="330.0" y1="601.9" x2="330.0" y2="633.9" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="40.0" y="658.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >G = 1,1</text>
<text x="560.0" y="658.9" font-size="13" fill="#eb6834" font-weight="700" text-anchor="end" >se desboca</text>
<rect x="40.0" y="665.9" width="58.0" height="24" fill="#eb6834" stroke="#fcfcfb" stroke-width="1"/>
<rect x="98.0" y="665.9" width="63.8" height="24" fill="#fbd9ca" stroke="#fcfcfb" stroke-width="1"/>
<rect x="161.8" y="665.9" width="70.2" height="24" fill="#eb6834" stroke="#fcfcfb" stroke-width="1"/>
<rect x="232.0" y="665.9" width="77.2" height="24" fill="#fbd9ca" stroke="#fcfcfb" stroke-width="1"/>
<rect x="309.2" y="665.9" width="84.9" height="24" fill="#eb6834" stroke="#fcfcfb" stroke-width="1"/>
<rect x="394.1" y="665.9" width="93.4" height="24" fill="#fbd9ca" stroke="#fcfcfb" stroke-width="1"/>
<rect x="487.5" y="665.9" width="42.5" height="24" fill="#eb6834" stroke="#fcfcfb" stroke-width="1"/>
<line x1="532.0" y1="677.9" x2="560.0" y2="677.9" stroke="#eb6834" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#fl_na)"/>
<text x="40.0" y="711.4" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >Cada tramo es G veces el anterior. Si G &lt; 1, la suma tiene techo: 1 ÷ (1 − G). Si G ≥ 1,</text>
<text x="40.0" y="726.9" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >crece hasta que algo lo frena.</text>
<line x1="40.0" y1="757.9" x2="560.0" y2="757.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="784.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >El volante es una suma: con G = 0,5 una baja de costo vale el</text>
<text x="40.0" y="805.1" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >doble; con 0,8, cinco veces; con G ≥ 1 se desboca hasta que el</text>
<text x="40.0" y="825.4" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >mercado, la capacidad o la caja lo frenan.</text>
<text x="40.0" y="846.1" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Ejemplo del texto: t = 1, ε = 1,5 y b = 0,32 dan G ≈ 0,48: útil, no milagroso. Si</text>
<text x="40.0" y="863.4" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >no se puede poner un número en al menos dos flechas, no es un lazo: es un dibujo.</text>
<text x="40.0" y="887.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Modelo simplificado de largo plazo, sin retardos ni saturación. Con r = 20 % (b ≈ 0,32) y t =</text>
<text x="40.0" y="902.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >1, G pasa de 1 sólo si ε &gt; 3, cosa que pasa pocas veces y dura poco.</text>
<text x="40.0" y="924.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>