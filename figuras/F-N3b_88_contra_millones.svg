<line x1="710.0" y1="232.6" x2="710.0" y2="266.6" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="180.0" y="249.6" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end" >r = 15 %</text>
<text x="180.0" y="264.6" font-size="11" fill="#52514e" font-weight="400" text-anchor="end" >14,2 duplicaciones</text>
<rect x="190.0" y="236.6" width="316.8" height="26.0" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="514.8" y="254.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >≈ 18.400 ×</text>
<line x1="190.0" y1="230.6" x2="190.0" y2="268.6" stroke="#8a8984" stroke-width="1.0"/>
<line x1="190.0" y1="276.6" x2="190.0" y2="310.6" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="264.3" y1="276.6" x2="264.3" y2="310.6" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="338.6" y1="276.6" x2="338.6" y2="310.6" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="412.9" y1="276.6" x2="412.9" y2="310.6" stroke="#e6e5e0" stroke-width="1.0"/>
