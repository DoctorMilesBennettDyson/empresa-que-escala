<line x1="338.6" y1="144.6" x2="338.6" y2="178.6" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="487.1" y1="144.6" x2="487.1" y2="178.6" stroke="#e6e5e0" stroke-width="1.0"/>
