<text x="180.0" y="117.6" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end" >r = 30 %</text>
<text x="180.0" y="132.6" font-size="11" fill="#52514e" font-weight="400" text-anchor="end" >6,5 duplicaciones</text>
<rect x="190.0" y="104.6" width="144.4" height="26.0" fill="#2a78d6"/>
<text x="342.4" y="122.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >≈ 88 ×</text>
