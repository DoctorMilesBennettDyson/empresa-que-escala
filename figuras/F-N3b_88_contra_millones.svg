<text x="377.0" y="166.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >≈ 256 ×</text>
<line x1="190.0" y1="142.6" x2="190.0" y2="180.6" stroke="#8a8984" stroke-width="1.0"/>
<line x1="190.0" y1="188.6" x2="190.0" y2="222.6" stroke="#e6e5e0" stroke-width="1.0"/>
