<line x1="561.4" y1="276.6" x2="561.4" y2="310.6" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="635.7" y1="276.6" x2="635.7" y2="310.6" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="180.0" y="293.6" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="end" >r = 10 %</text>
<text x="180.0" y="308.6" font-size="11" fill="#52514e" font-weight="400" text-anchor="end" >21,9 duplicaciones</text>
<rect x="190.0" y="280.6" width="488.7" height="26.0" fill="#eb6834"/>
<text x="686.7" y="298.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >≈ 3,8 millones ×</text>
<line x1="190.0" y1="274.6" x2="190.0" y2="312.6" stroke="#8a8984" stroke-width="1.0"/>
<text x="190.0" y="326.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >1</text>
<text x="264.3" y="326.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >10</text>
<text x="338.6" y="326.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >100</text>
<text x="412.9" y="326.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >1.000</text>
<text x="487.1" y="326.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >10.000</text>
<text x="561.4" y="326.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >100.000</text>
<text x="635.7" y="326.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >1 millón</text>
<text x="710.0" y="326.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >10 mill.</text>
<line x1="40.0" y1="350.6" x2="860.0" y2="350.6" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="377.6" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Con 30 % de aprendizaje alcanza con 88 veces el volumen; con 10 %, casi cuatro millones.</text>
<text x="40.0" y="398.3" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Es el mismo objetivo y son dos universos: uno es un plan de negocios, el otro una fantasía. Y depende de un número que casi nadie</text>
<text x="40.0" y="415.6" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >mide.</text>
<text x="40.0" y="439.3" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Ley de Wright: duplicaciones N = ln(0,1) ÷ ln(1 − r); el volumen acumulado se multiplica por 2^N. Supone que r se mantiene; hay que medirlo en cada</text>
<text x="40.0" y="454.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >caso.</text>
