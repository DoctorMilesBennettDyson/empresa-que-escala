<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 481" width="900" height="481" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">NCR 2760: la pieza que no existe</title>
<desc id="d">Cuatro pares de barras, antes = 100: piezas 15, tiempo de armado 25, herramientas 0, proveedores 35.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="900" height="481" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Qué se gana preguntando si cada pieza tiene que existir?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >La terminal de punto de venta NCR 2760, rediseñada con esa pregunta. Cada fila compara contra su propio antes, que vale</text>
<text x="40.0" y="77.4" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >100.</text>
<text x="226.0" y="128.6" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end" >piezas</text>
<rect x="240.0" y="104.6" width="500.0" height="16.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="748.0" y="117.6" font-size="12" fill="#8a8984" font-weight="700" text-anchor="start" >antes · 100</text>
<rect x="240.0" y="124.6" width="75.0" height="16.0" fill="#2a78d6"/>
<text x="323.0" y="137.6" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start" >después · 15</text>
<text x="226.0" y="188.6" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end" >tiempo de armado</text>
<rect x="240.0" y="164.6" width="500.0" height="16.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="748.0" y="177.6" font-size="12" fill="#8a8984" font-weight="700" text-anchor="start" >100</text>
<rect x="240.0" y="184.6" width="125.0" height="16.0" fill="#2a78d6"/>
<text x="373.0" y="197.6" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start" >25</text>
<text x="226.0" y="248.6" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end" >herramientas de armado</text>
<rect x="240.0" y="224.6" width="500.0" height="16.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="748.0" y="237.6" font-size="12" fill="#8a8984" font-weight="700" text-anchor="start" >100</text>
<text x="248.0" y="257.6" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start" >ninguna</text>
<text x="226.0" y="308.6" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="end" >proveedores</text>
<rect x="240.0" y="284.6" width="500.0" height="16.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="748.0" y="297.6" font-size="12" fill="#8a8984" font-weight="700" text-anchor="start" >100</text>
<rect x="240.0" y="304.6" width="175.0" height="16.0" fill="#2a78d6"/>
<text x="423.0" y="317.6" font-size="13" fill="#2a78d6" font-weight="700" text-anchor="start" >35</text>
<line x1="40.0" y1="348.6" x2="860.0" y2="348.6" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="375.6" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Con esa pregunta, la NCR 2760 quedó con 85 % menos piezas, 75 % menos tiempo de armado, ninguna</text>
<text x="40.0" y="395.8" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >herramienta de armado y 65 % menos proveedores.</text>
<text x="40.0" y="416.6" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Se estimó que sacar un solo tornillo ahorraba hasta US$12.500 en la vida del producto.</text>
<text x="40.0" y="440.3" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Boothroyd, Dewhurst y Knight 2002, §1.5.4 [verificado, primaria]. Cada fila compara contra su propio antes; las filas no se comparan entre sí.</text>
<text x="40.0" y="461.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>