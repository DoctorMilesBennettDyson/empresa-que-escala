<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 598" width="600" height="598" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Costo por kilo a órbita baja</title>
<desc id="d">Transbordador espacial ≈ 54.500 dólares por kilo, Falcon 9 ≈ 2.720, y el objetivo declarado del Starship, del orden de 100.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="600" height="598" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Cuánto cuesta subir un kilo a la órbita</text>
<text x="40.0" y="64.3" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >baja?</text>
<text x="40.0" y="86.1" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Dólares por kilo, en escala logarítmica: cada marca vale diez veces la</text>
<text x="40.0" y="104.7" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >anterior.</text>
<text x="40.0" y="144.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Transbordador espacial</text>
<text x="40.0" y="161.9" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >1981-2011</text>
<text x="40.0" y="237.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Falcon 9</text>
<text x="40.0" y="254.9" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >Jones 2018</text>
<text x="40.0" y="330.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Starship</text>
<text x="40.0" y="347.9" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >objetivo declarado, no un dato</text>
<line x1="40.0" y1="166.9" x2="40.0" y2="206.9" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="147.5" y1="166.9" x2="147.5" y2="206.9" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="255.0" y1="166.9" x2="255.0" y2="206.9" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="362.5" y1="166.9" x2="362.5" y2="206.9" stroke="#e6e5e0" stroke-width="1.0"/>
<rect x="40.0" y="170.9" width="401.7" height="32.0" fill="#eb6834"/>
<text x="449.7" y="191.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >54.500</text>
