<rect x="40.0" y="263.9" width="261.7" height="32.0" fill="#2a78d6"/>
<text x="309.7" y="284.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >2.720</text>
<line x1="40.0" y1="257.9" x2="40.0" y2="301.9" stroke="#8a8984" stroke-width="1.0"/>
<line x1="40.0" y1="352.9" x2="40.0" y2="392.9" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="147.5" y1="352.9" x2="147.5" y2="392.9" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="255.0" y1="352.9" x2="255.0" y2="392.9" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="362.5" y1="352.9" x2="362.5" y2="392.9" stroke="#e6e5e0" stroke-width="1.0"/>
<line x1="470.0" y1="352.9" x2="470.0" y2="392.9" stroke="#e6e5e0" stroke-width="1.0"/>
<rect x="40.0" y="356.9" width="107.5" height="32.0" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2.25"/>
<text x="155.5" y="377.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >≈ 100</text>
<line x1="40.0" y1="350.9" x2="40.0" y2="394.9" stroke="#8a8984" stroke-width="1.0"/>
<text x="40.0" y="408.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >10</text>
<text x="147.5" y="408.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >100</text>
<text x="255.0" y="408.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >1.000</text>
<text x="362.5" y="408.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >10.000</text>
<text x="470.0" y="408.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >100.000</text>
<line x1="40.0" y1="432.9" x2="560.0" y2="432.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="459.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Del transbordador al Falcon 9, el costo por kilo se dividió por</text>
<text x="40.0" y="480.1" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >20. El objetivo del Starship pide dividirlo otra vez por 27.</text>
<text x="40.0" y="500.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Eso no sale de optimizar el cohete anterior: sale de cambiar el diseño entero</text>
<text x="40.0" y="518.1" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >(figura 2).</text>
<text x="40.0" y="541.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Transbordador y Falcon 9: Jones 2018 (NASA). Barra hueca: objetivo declarado por SpaceX, no un</text>
<text x="40.0" y="557.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >costo medido.</text>
