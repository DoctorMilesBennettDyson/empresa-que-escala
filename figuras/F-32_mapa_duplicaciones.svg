<text x="657.6" y="379.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >18</text>
<line x1="726.2" y1="361.9" x2="726.2" y2="366.9" stroke="#8a8984" stroke-width="1.0"/>
<text x="726.2" y="379.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="middle" >20</text>
<text x="383.1" y="397.9" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >duplicaciones desde US$1.000 por año</text>
<line x1="40.0" y1="423.9" x2="860.0" y2="423.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="450.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Son unas 20 duplicaciones: es finito y contable. Pero cada una cuesta más que la anterior, porque en</text>
<text x="40.0" y="471.2" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >cada orden cambia el cuello de botella.</text>
<text x="40.0" y="491.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Quien es excelente en 10⁴ fracasa en 10⁶ haciendo exactamente lo que lo hizo excelente.</text>
<text x="40.0" y="515.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >log₂ 10⁶ = 19,9. Lo que mata en cada orden es una heurística [hipótesis]: los modelos de etapas de crecimiento no tienen confirmación empírica (Levie</text>
<text x="40.0" y="531.3" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >y Lichtenstein 2010).</text>
