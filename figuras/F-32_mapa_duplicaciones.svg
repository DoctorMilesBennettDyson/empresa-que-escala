<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" width="900" height="572" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">El mapa de duplicaciones</title>
<desc id="d">Escalera de siete órdenes de magnitud de facturación anual, de mil dólares a mil millones, unas veinte duplicaciones en total, con lo que mata al negocio en cada peldaño.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="900" height="572" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >De mil dólares a mil millones por año: ¿cuántas duplicaciones?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Unas 20, no mil: cada orden de magnitud son unas 3,3. Y en cada uno cambia lo que mata.</text>
<path d="M40.0,361.93 V337.9 H153.9 V311.9 H267.9 V285.9 H381.9 V259.9 H495.8 V233.9 H609.8 V207.9 H723.8 V181.9 H837.8 V361.93 Z" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="46.0" y="354.9" font-size="11.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >10³ · US$1.000</text>
<text x="46.0" y="300.6" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" >trabajo ocasional</text>
<text x="46.0" y="315.6" font-size="11" fill="#eb6834" font-weight="600" text-anchor="start" >mata: no empezar</text>
<text x="160.0" y="328.9" font-size="11.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >10⁴ · US$10.000</text>
<text x="160.0" y="260.3" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" >oficio propio</text>
<text x="160.0" y="275.3" font-size="11" fill="#eb6834" font-weight="600" text-anchor="start" >mata: el tiempo</text>
<text x="160.0" y="289.6" font-size="11" fill="#eb6834" font-weight="600" text-anchor="start" >del dueño</text>
<text x="273.9" y="302.9" font-size="11.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >10⁵ · US$100.000</text>
<text x="273.9" y="248.6" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" >negocio chico</text>
<text x="273.9" y="263.6" font-size="11" fill="#eb6834" font-weight="600" text-anchor="start" >mata: la caja</text>
<text x="387.9" y="276.9" font-size="11.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >10⁶ ·</text>
<text x="387.9" y="290.9" font-size="11.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >US$1 millón</text>
<text x="387.9" y="208.3" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" >pequeña empresa</text>
