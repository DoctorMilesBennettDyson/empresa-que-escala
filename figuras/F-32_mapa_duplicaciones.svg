<text x="729.8" y="212.9" font-size="11.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >US$1.000 millones</text>
<text x="729.8" y="116.0" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" >corporación</text>
<text x="729.8" y="131.0" font-size="11" fill="#eb6834" font-weight="600" text-anchor="start" >mata: el gobierno</text>
<text x="729.8" y="145.3" font-size="11" fill="#eb6834" font-weight="600" text-anchor="start" >interno y la</text>
<text x="729.8" y="159.6" font-size="11" fill="#eb6834" font-weight="600" text-anchor="start" >regulación</text>
