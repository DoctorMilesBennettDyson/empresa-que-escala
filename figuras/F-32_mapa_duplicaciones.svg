<text x="615.9" y="238.9" font-size="11.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >US$100 millones</text>
<text x="615.9" y="170.6" font-size="11" fill="#52514e" font-weight="400" text-anchor="start" >empresa grande</text>
<text x="615.9" y="185.6" font-size="11" fill="#eb6834" font-weight="600" text-anchor="start" >mata: el mercado</text>
