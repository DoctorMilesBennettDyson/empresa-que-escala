<rect width="900" height="643" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Por qué una agenda llena al 100 % no funciona?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Espera promedio en la cola, contada en tiempos de atención, según la parte de la capacidad que está ocupada.</text>
