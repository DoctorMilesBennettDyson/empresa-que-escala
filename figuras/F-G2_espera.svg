<text x="685.4" y="328.9" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="end" >80 % → 4</text>
<circle cx="774.2" cy="251.4" r="5.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="763.2" y="256.4" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="end" >90 % → 9</text>
<circle cx="813.1" cy="106.4" r="5.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="802.1" y="111.4" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="end" >95 % → 19</text>
<text x="84.0" y="112.2" font-size="12.5" fill="#2a78d6" font-weight="700" text-anchor="start" >— pedidos que llegan al azar</text>
<text x="84.0" y="131.2" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >- - turnos fijos y tiempos parejos</text>
<line x1="735.3" y1="431.9" x2="852.0" y2="431.9" stroke="#eb6834" stroke-width="1.4"/>
<line x1="735.3" y1="426.9" x2="735.3" y2="436.9" stroke="#eb6834" stroke-width="1.4"/>
<line x1="852.0" y1="426.9" x2="852.0" y2="436.9" stroke="#eb6834" stroke-width="1.4"/>
<text x="852.0" y="451.9" font-size="11.5" fill="#eb6834" font-weight="600" text-anchor="end" >hospitales: desde el 85 % de camas ocupadas, riesgo de no poder internar</text>
<line x1="40.0" y1="479.9" x2="860.0" y2="479.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="506.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Del 80 % al 90 % de ocupación, la espera pasa de 4 a 9 tiempos de atención; al 95 %, a 19. Hay que</text>
<text x="40.0" y="527.2" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >dejar capacidad libre a propósito.</text>
<text x="40.0" y="547.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Si atender un pedido lleva un día y la agenda está al 90 %, el pedido espera nueve días antes de que alguien lo toque.</text>
<text x="40.0" y="571.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Curva ocupación ÷ (1 − ocupación), para llegadas y tiempos al azar (Kingman 1961). La fórmula también multiplica por la variabilidad: con turnos</text>
<text x="40.0" y="587.3" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >fijos y tiempos parejos se puede trabajar más cerca del 100 % (la línea de trazos usa una variabilidad cuatro veces menor, ilustrativa). Hospitales:</text>
<text x="40.0" y="602.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Bagust, Place y Posnett, BMJ 1999 [verificado, secundaria].</text>
