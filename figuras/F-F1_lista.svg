<line x1="40.0" y1="350.4" x2="860.0" y2="350.4" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="377.4" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Donde se aplicó, la lista bajó la mortalidad de 15 a 8 por cada 1.000 operaciones; donde se impuso</text>
<text x="40.0" y="397.6" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >por norma, no la movió.</text>
<text x="40.0" y="418.4" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >La lista funciona cuando el equipo la usa de verdad, no cuando se firma. En el estudio de la OMS, además, las complicaciones</text>
<text x="40.0" y="435.6" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >bajaron de 11 a 7 de cada 100.</text>
<text x="40.0" y="459.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Muertes por cada 1.000 operaciones = mortalidad en % × 10. OMS: Haynes y otros, NEJM 2009, antes y después, 7.688 pacientes, de 1,5 % a 0,8 %</text>
<text x="40.0" y="475.0" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >[verificado, primaria]. Ontario: Urbach y otros, NEJM 2014, de 0,71 % a 0,65 % [verificado, primaria]. Son poblaciones distintas: se compara el</text>
<text x="40.0" y="490.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >cambio dentro de cada estudio, no los niveles.</text>
