<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Alcanza con tener una lista de verificación?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >La lista de verificación quirúrgica en dos estudios. Cada cuadrito es una muerte por cada 1.000 operaciones.</text>
<text x="40.0" y="99.4" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >OMS, 2009: la lista aplicada en ocho hospitales de ocho países</text>
