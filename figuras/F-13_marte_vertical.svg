<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1023" width="600" height="1023" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">De la misión al material</title>
<desc id="d">Nueve eslabones: misión a Marte, reutilización, recarga en órbita, cadencia, propelente fabricado en Marte, motor de metano, fabricación barata, estructura soldada y acero inoxidable.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="600" height="1023" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Por qué un cohete de acero, el material de</text>
<text x="40.0" y="64.3" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >las ollas?</text>
<text x="40.0" y="86.1" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >De la misión al material en nueve eslabones: cada uno obliga al siguiente.</text>
<rect x="40.0" y="113.2" width="520.0" height="64.9" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="2"/>
<circle cx="60.0" cy="134.2" r="11" fill="#2a78d6"/>
<text x="60.0" y="138.7" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >1</text>
<text x="78.0" y="139.2" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Misión</text>
<text x="54.0" y="163.7" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >carga masiva a Marte: el costo por kilo tiene que bajar unas 27 veces</text>
<line x1="60.0" y1="180.1" x2="60.0" y2="196.1" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#fl)"/>
<rect x="40.0" y="198.1" width="520.0" height="64.9" rx="6" fill="#fcfcfb" stroke="#8a8984" stroke-width="1"/>
<circle cx="60.0" cy="219.1" r="11" fill="#2a78d6"/>
<text x="60.0" y="223.6" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >2</text>
<text x="78.0" y="224.1" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Reutilización</text>
<text x="54.0" y="248.6" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >un cohete que se tira no llega: hay que reutilizar las dos etapas</text>
<line x1="60.0" y1="265.0" x2="60.0" y2="281.0" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#fl)"/>
<rect x="40.0" y="283.0" width="520.0" height="64.9" rx="6" fill="#fcfcfb" stroke="#8a8984" stroke-width="1"/>
<circle cx="60.0" cy="304.0" r="11" fill="#2a78d6"/>
<text x="60.0" y="308.5" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >3</text>
<text x="78.0" y="309.0" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Recarga en órbita</text>
<text x="54.0" y="333.5" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >no alcanza sin varios vuelos cisterna por cada vuelo útil</text>
<line x1="60.0" y1="349.9" x2="60.0" y2="365.9" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#fl)"/>
<rect x="40.0" y="367.9" width="520.0" height="64.9" rx="6" fill="#fcfcfb" stroke="#8a8984" stroke-width="1"/>
<circle cx="60.0" cy="388.9" r="11" fill="#2a78d6"/>
<text x="60.0" y="393.4" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >4</text>
<text x="78.0" y="393.9" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Cadencia</text>
<text x="54.0" y="418.4" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >una ventana hacia Marte cada 26 meses: lanzar seguido pasa a ser requisito</text>
<line x1="60.0" y1="434.7" x2="60.0" y2="450.7" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#fl)"/>
<rect x="40.0" y="452.7" width="520.0" height="64.9" rx="6" fill="#fcfcfb" stroke="#8a8984" stroke-width="1"/>
<circle cx="60.0" cy="473.7" r="11" fill="#2a78d6"/>
<text x="60.0" y="478.2" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >5</text>
<text x="78.0" y="478.7" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Propelente</text>
<text x="54.0" y="503.2" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >el de la vuelta se fabrica allá con CO₂ y agua (Sabatier): metano y oxígeno</text>
<line x1="60.0" y1="519.6" x2="60.0" y2="535.6" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#fl)"/>
<rect x="40.0" y="537.6" width="520.0" height="64.9" rx="6" fill="#fcfcfb" stroke="#8a8984" stroke-width="1"/>
<circle cx="60.0" cy="558.6" r="11" fill="#2a78d6"/>
<text x="60.0" y="563.1" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >6</text>
<text x="78.0" y="563.6" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Motor</text>
<text x="54.0" y="588.1" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >metano, alta presión y reutilización rápida</text>
<line x1="60.0" y1="604.5" x2="60.0" y2="620.5" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#fl)"/>
<rect x="40.0" y="622.5" width="520.0" height="64.9" rx="6" fill="#fcfcfb" stroke="#8a8984" stroke-width="1"/>
<circle cx="60.0" cy="643.5" r="11" fill="#2a78d6"/>
<text x="60.0" y="648.0" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >7</text>
<text x="78.0" y="648.5" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Fabricación</text>
<text x="54.0" y="673.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >muchos motores: diseñados para costar poco, no para el máximo rendimiento</text>
<line x1="60.0" y1="689.4" x2="60.0" y2="705.4" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#fl)"/>
<rect x="40.0" y="707.4" width="520.0" height="64.9" rx="6" fill="#fcfcfb" stroke="#8a8984" stroke-width="1"/>
<circle cx="60.0" cy="728.4" r="11" fill="#2a78d6"/>
<text x="60.0" y="732.9" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >8</text>
<text x="78.0" y="733.4" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Estructura</text>
<text x="54.0" y="757.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >muchos vehículos, soldados al aire libre y rotos seguido en las pruebas</text>
<line x1="60.0" y1="774.2" x2="60.0" y2="790.2" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#fl)"/>
<rect x="40.0" y="792.2" width="520.0" height="64.9" rx="6" fill="#cde2fb" stroke="#2a78d6" stroke-width="2.25"/>
<circle cx="60.0" cy="813.2" r="11" fill="#2a78d6"/>
<text x="60.0" y="817.7" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >9</text>
<text x="78.0" y="818.2" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Material</text>
<text x="54.0" y="842.7" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >acero inoxidable: barato, se suelda en un galpón y es más resistente en frío</text>
<line x1="40.0" y1="875.1" x2="560.0" y2="875.1" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="902.1" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Leída desde abajo, la elección del acero parece un capricho.</text>
<text x="40.0" y="922.4" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Leída desde la misión, no había otra.</text>
<text x="40.0" y="943.1" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Ésa es la diferencia entre una decisión de ingeniería y una decisión de misión.</text>
<text x="40.0" y="966.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Cadena reconstruida por este libro a partir de lo que SpaceX explicó en público; no es un</text>
<text x="40.0" y="982.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >documento de diseño de la empresa, y el orden real de las decisiones fue más desordenado.</text>
<text x="40.0" y="1004.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>