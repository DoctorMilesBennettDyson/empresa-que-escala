<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 915" width="600" height="915" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Apple 1976-1977: seis funciones, tres personas</title>
<desc id="d">Matriz de seis funciones por tres personas (Wozniak, Jobs y Markkula), con un punto y el dato del caso donde cada uno cubría la función; la fila 6, sin datos.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="600" height="915" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Quién cubría cada función en Apple, en 1976</text>
<text x="40.0" y="64.3" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >y 1977?</text>
<text x="40.0" y="86.1" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Las seis funciones de §1.1 contra las tres personas que hicieron funcionar la</text>
<text x="40.0" y="104.7" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >empresa. Cada punto lleva el dato del caso que lo sostiene.</text>
<text x="251.7" y="146.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >Wozniak</text>
<text x="251.7" y="165.9" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >el producto</text>
<text x="251.7" y="182.1" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >técnico</text>
<text x="375.0" y="146.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >Jobs</text>
<text x="375.0" y="165.9" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >la definición del</text>
<text x="375.0" y="182.1" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >producto y la</text>
<text x="375.0" y="198.3" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >venta</text>
<text x="498.3" y="146.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >Markkula</text>
<text x="498.3" y="165.9" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >el capital y el</text>
<text x="498.3" y="182.1" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >método comercial</text>
<line x1="40.0" y1="212.5" x2="560.0" y2="212.5" stroke="#8a8984" stroke-width="1.0"/>
<text x="40.0" y="247.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >1 · Entender al</text>
<text x="40.0" y="265.2" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >cliente</text>
<circle cx="450.7" cy="252.2" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="462.7" y="233.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >«empatía»:</text>
<text x="462.7" y="248.3" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >entender al</text>
<text x="462.7" y="263.2" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >cliente mejor</text>
<text x="462.7" y="278.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >que nadie</text>
<line x1="40.0" y1="291.9" x2="560.0" y2="291.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="319.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >2 · Definir el</text>
<text x="40.0" y="337.1" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >producto</text>
<circle cx="204.0" cy="324.1" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="216.0" y="320.3" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >ocho ranuras de</text>
<text x="216.0" y="335.1" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >expansión</text>
<circle cx="327.3" cy="324.1" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="339.3" y="312.9" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >una máquina</text>
<text x="339.3" y="327.7" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >terminada, con</text>
<text x="339.3" y="342.6" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >gabinete</text>
<circle cx="450.7" cy="324.1" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="462.7" y="320.3" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >«foco»: sacar lo</text>
<text x="462.7" y="335.1" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >que no importa</text>
<line x1="40.0" y1="356.4" x2="560.0" y2="356.4" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="384.1" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >3 · Producir con</text>
<text x="40.0" y="401.7" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >calidad</text>
<circle cx="204.0" cy="388.7" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="216.0" y="377.4" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >diseño con muy</text>
<text x="216.0" y="392.3" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >pocos</text>
<text x="216.0" y="407.1" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >componentes</text>
<line x1="40.0" y1="421.0" x2="560.0" y2="421.0" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="456.1" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >4 · Vender y</text>
<text x="40.0" y="473.7" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >distribuir</text>
<circle cx="327.3" cy="460.7" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="339.3" y="449.4" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >vendió cincuenta</text>
<text x="339.3" y="464.2" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >Apple I a una</text>
<text x="339.3" y="479.1" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >tienda</text>
<circle cx="450.7" cy="460.7" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="462.7" y="442.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >«imputar»: la</text>
<text x="462.7" y="456.8" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >presentación</text>
<text x="462.7" y="471.7" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >comunica la</text>
<text x="462.7" y="486.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >calidad</text>
<line x1="40.0" y1="500.4" x2="560.0" y2="500.4" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="528.1" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >5 · Financiar y</text>
<text x="40.0" y="545.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >sobrevivir</text>
<circle cx="450.7" cy="532.6" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="462.7" y="521.4" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >US$250.000 por</text>
<text x="462.7" y="536.2" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >un tercio de la</text>
<text x="462.7" y="551.1" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="start" >empresa</text>
<line x1="40.0" y1="564.9" x2="560.0" y2="564.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="587.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >6 · Organizar y</text>
<text x="40.0" y="605.5" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >aprender</text>
<text x="375.0" y="596.5" font-size="12" fill="#8a8984" font-weight="400" text-anchor="middle" >el caso no lo cuenta</text>
<line x1="40.0" y1="620.0" x2="560.0" y2="620.0" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="251.7" y="640.0" font-size="12" fill="#eb6834" font-weight="700" text-anchor="middle" >solo: filas 1, 4</text>
<text x="251.7" y="656.2" font-size="12" fill="#eb6834" font-weight="700" text-anchor="middle" >y 5 vacías</text>
<text x="375.0" y="640.0" font-size="12" fill="#eb6834" font-weight="700" text-anchor="middle" >solo: filas 1, 3</text>
<text x="375.0" y="656.2" font-size="12" fill="#eb6834" font-weight="700" text-anchor="middle" >y 5 vacías</text>
<text x="498.3" y="640.0" font-size="12" fill="#eb6834" font-weight="700" text-anchor="middle" >solo: fila 3</text>
<text x="498.3" y="656.2" font-size="12" fill="#eb6834" font-weight="700" text-anchor="middle" >vacía</text>
<line x1="40.0" y1="678.4" x2="560.0" y2="678.4" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="705.4" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Juntos, los tres llenaban las cinco filas de las que el caso da</text>
<text x="40.0" y="725.7" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >datos; solo, a cada uno le quedaba al menos una fila vacía.</text>
<text x="40.0" y="745.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Contar puntos por columna es sumar, y una empresa es un</text>
<text x="40.0" y="766.2" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >producto: lo que decide es que ninguna fila quede en cero.</text>
<text x="40.0" y="786.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >La pregunta útil no es quién tuvo más mérito, sino qué función está en cero en este</text>
<text x="40.0" y="804.2" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >negocio y quién la va a cubrir.</text>
<text x="40.0" y="827.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >[reportado — Isaacson 2011; Wozniak 2006; documento en el archivo de Steve Jobs]. A qué</text>
<text x="40.0" y="843.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >función corresponde cada dato es una lectura del caso [interpretación]: el texto dice «el</text>
<text x="40.0" y="859.2" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >producto técnico», «la definición del producto y la venta» y «el capital y el método</text>
<text x="40.0" y="874.8" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >comercial». Que la fila 6 no tenga puntos no dice que nadie la cubriera: el caso no lo cuenta.</text>
<text x="40.0" y="896.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>