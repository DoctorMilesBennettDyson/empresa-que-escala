<line x1="40.0" y1="437.9" x2="860.0" y2="437.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="464.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >La curva no se aplanó: cada escalón pide el doble de volumen que el anterior.</text>
<text x="40.0" y="485.7" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >De 128 a 256 unidades hacen falta 128 más; de 512 a 1.024, 512 más. Mirada por mes parece un piso; mirada por duplicación, sigue</text>
<text x="40.0" y="502.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >bajando.</text>
<text x="40.0" y="526.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Ley de Wright con r = 20 % por duplicación (b = 0,322). La curva no es automática: baja sólo si en cada duplicación alguien rediseña el proceso.</text>
