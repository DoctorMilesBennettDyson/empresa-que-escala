<text x="338.0" y="270.0" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >7,1</text>
<text x="130.0" y="297.0" font-size="12" fill="#52514e" font-weight="600" text-anchor="end" >con la lista</text>
<rect x="140.0" y="283.0" width="20" height="20" rx="1.5" fill="#ecebe6" stroke="#8a8984" stroke-width="1"/>
<rect x="164.0" y="283.0" width="20" height="20" rx="1.5" fill="#ecebe6" stroke="#8a8984" stroke-width="1"/>
<rect x="188.0" y="283.0" width="20" height="20" rx="1.5" fill="#ecebe6" stroke="#8a8984" stroke-width="1"/>
<rect x="212.0" y="283.0" width="20" height="20" rx="1.5" fill="#ecebe6" stroke="#8a8984" stroke-width="1"/>
<rect x="236.0" y="283.0" width="20" height="20" rx="1.5" fill="#ecebe6" stroke="#8a8984" stroke-width="1"/>
<rect x="260.0" y="283.0" width="20" height="20" rx="1.5" fill="#ecebe6" stroke="#8a8984" stroke-width="1"/>
<rect x="284.0" y="283.0" width="10.0" height="20" rx="1.5" fill="#ecebe6"/>
<rect x="284.0" y="283.0" width="20" height="20" rx="1.5" fill="none" stroke="#8a8984" stroke-width="1" stroke-dasharray="3 2"/>
<text x="314.0" y="298.0" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >6,5</text>
<text x="140.0" y="323.0" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >diferencia no significativa</text>
<line x1="40.0" y1="353.0" x2="560.0" y2="353.0" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="380.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Donde se aplicó, la lista bajó la mortalidad de 15 a 8 por cada</text>
<text x="40.0" y="400.3" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >1.000 operaciones; donde se impuso por norma, no la movió.</text>
<text x="40.0" y="421.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >La lista funciona cuando el equipo la usa de verdad, no cuando se firma. En el</text>
<text x="40.0" y="438.3" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >estudio de la OMS, además, las complicaciones bajaron de 11 a 7 de cada 100.</text>
<text x="40.0" y="462.0" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Muertes por cada 1.000 operaciones = mortalidad en % × 10. OMS: Haynes y otros, NEJM 2009,</text>
<text x="40.0" y="477.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >antes y después, 7.688 pacientes, de 1,5 % a 0,8 % [verificado, primaria]. Ontario: Urbach y</text>
<text x="40.0" y="493.2" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >otros, NEJM 2014, de 0,71 % a 0,65 % [verificado, primaria]. Son poblaciones distintas: se</text>
<text x="40.0" y="508.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >compara el cambio dentro de cada estudio, no los niveles.</text>
