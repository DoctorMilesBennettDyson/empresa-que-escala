<rect x="284.0" y="158.8" width="20" height="20" rx="1.5" fill="#2a78d6"/>
<rect x="308.0" y="158.8" width="20" height="20" rx="1.5" fill="#2a78d6"/>
<text x="338.0" y="173.8" font-size="13.5" fill="#2a78d6" font-weight="700" text-anchor="start" >8</text>
<text x="140.0" y="198.8" font-size="12.5" fill="#2a78d6" font-weight="700" text-anchor="start" >7 muertes menos de cada 1.000</text>
<text x="40.0" y="242.3" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Ontario, 2014: la lista obligatoria por norma en 101 hospitales</text>
<text x="130.0" y="269.0" font-size="12" fill="#52514e" font-weight="600" text-anchor="end" >antes</text>
<rect x="140.0" y="255.0" width="20" height="20" rx="1.5" fill="#ecebe6" stroke="#8a8984" stroke-width="1"/>
