<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" width="600" height="780" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Peldaño, piso y pozo</title>
<desc id="d">Matriz de dos por dos: vende hoy y abarata la siguiente es peldaño; sólo vende, piso; sólo abarata, pozo; ninguna, cortar. Escaleras: Falcon 1, Falcon 9, Starship y Starlink; y encargo, molde, segundo producto en un taller.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="600" height="780" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Esta etapa es un peldaño, un piso o un pozo?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Dos preguntas, cuatro casillas. Y dos escaleras: una real y una a escala de</text>
<text x="40.0" y="77.4" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >taller.</text>
<text x="332.0" y="116.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle" >¿Abarata la etapa siguiente?</text>
<text x="218.0" y="136.6" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="middle" >Sí</text>
<text x="446.0" y="136.6" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="middle" >No</text>
<text x="48.0" y="224.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle" transform="rotate(-90 48 224.56)">¿Vende algo hoy?</text>
<text x="94.0" y="191.6" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="end" >Sí</text>
<rect x="107.0" y="153.6" width="222.0" height="68.0" rx="4" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.6"/>
<text x="218.0" y="185.6" font-size="15" fill="#fcfcfb" font-weight="700" text-anchor="middle" >PELDAÑO</text>
<text x="218.0" y="203.1" font-size="11.5" fill="#fcfcfb" font-weight="400" text-anchor="middle" >se sube por acá</text>
<rect x="335.0" y="153.6" width="222.0" height="68.0" rx="4" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="446.0" y="185.6" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >PISO</text>
<text x="446.0" y="203.1" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >se vive bien, pero no se sube</text>
<text x="94.0" y="265.6" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="end" >No</text>
<rect x="107.0" y="227.6" width="222.0" height="68.0" rx="4" fill="#fbd9ca" stroke="#eb6834" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="218.0" y="259.6" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >POZO</text>
<text x="218.0" y="277.1" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >saber cuánto dura (§3.5)</text>
<rect x="335.0" y="227.6" width="222.0" height="68.0" rx="4" fill="#ecebe6" stroke="#8a8984" stroke-width="1.6"/>
<text x="446.0" y="259.6" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >CORTAR</text>
<text x="446.0" y="277.1" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >no vende ni abarata</text>
<text x="40.0" y="337.6" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >SpaceX</text>
<rect x="40.0" y="380.6" width="158.7" height="77.0" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="48.0" y="397.6" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Falcon 1</text>
<text x="48.0" y="413.6" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start" >pozo</text>
<text x="48.0" y="429.1" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >no era un negocio:</text>
<text x="48.0" y="444.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >instaló la posición</text>
<line x1="201.7" y1="419.1" x2="217.7" y2="403.1" stroke="#0b0b0b" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="220.7" y="364.6" width="158.7" height="77.0" rx="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.8"/>
<text x="228.7" y="381.6" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Falcon 9</text>
<text x="228.7" y="397.6" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start" >peldaño</text>
<text x="228.7" y="413.1" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >vende y financia el</text>
<text x="228.7" y="428.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >siguiente</text>
<line x1="382.3" y1="403.1" x2="398.3" y2="387.1" stroke="#0b0b0b" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="401.3" y="348.6" width="158.7" height="77.0" rx="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.8"/>
<text x="409.3" y="365.6" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Starship y Starlink</text>
<text x="409.3" y="381.6" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start" >peldaño</text>
<text x="409.3" y="397.1" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >Starlink es la carga que</text>
<text x="409.3" y="412.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >justifica la escala</text>
<text x="40.0" y="492.6" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Un taller (ilustrativo)</text>
<rect x="40.0" y="535.6" width="158.7" height="77.0" rx="4" fill="#fcfcfb" stroke="#8a8984" stroke-width="1.8"/>
<text x="48.0" y="552.6" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Encargo a pedido</text>
<text x="48.0" y="568.6" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="start" >piso</text>
<text x="48.0" y="584.1" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >si no deja nada</text>
<text x="48.0" y="599.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >instalado</text>
<line x1="201.7" y1="574.1" x2="217.7" y2="558.1" stroke="#0b0b0b" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="220.7" y="519.6" width="158.7" height="77.0" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="228.7" y="536.6" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >El primer molde</text>
<text x="228.7" y="552.6" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start" >pozo</text>
<text x="228.7" y="568.1" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >no es un producto: es</text>
<text x="228.7" y="583.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >una posición</text>
<line x1="382.3" y1="558.1" x2="398.3" y2="542.1" stroke="#0b0b0b" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="401.3" y="503.6" width="158.7" height="77.0" rx="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.8"/>
<text x="409.3" y="520.6" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >El segundo producto</text>
<text x="409.3" y="536.6" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start" >peldaño</text>
<text x="409.3" y="552.1" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >sale más barato con el</text>
<text x="409.3" y="567.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >mismo molde</text>
<line x1="40.0" y1="630.7" x2="560.0" y2="630.7" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="657.7" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >No se escala un proyecto: se escala una posición, desde la cual</text>
<text x="40.0" y="677.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >el siguiente arranca más barato.</text>
<text x="40.0" y="698.7" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >La pregunta de cada etapa: ¿qué queda instalado cuando termine, que haga más barata</text>
<text x="40.0" y="715.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >la siguiente? «Más clientes» o «más experiencia» no es un peldaño: es un piso.</text>
<text x="40.0" y="739.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >La escalera de SpaceX resume la Parte 2; la del taller es ilustrativa.</text>
<text x="40.0" y="761.3" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>