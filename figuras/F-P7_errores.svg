<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Los doce errores, en su lugar</title>
<desc id="d">Los doce errores de la Parte 7 ubicados por su antídoto: seis sobre los cinco niveles (el 4 en el nivel 1; el 2 y el 6 en el 2; el 11 en el 3; el 1 en el 4; el 7 en el 5) y seis fuera de la escalera (3, 5, 8, 9, 10 y 12).</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="900" height="700" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Dónde se comete cada uno de los doce errores?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Cada error de la Parte 7 va donde apunta su antídoto: a uno de los cinco niveles, o a una receta o una prueba que no está</text>
<text x="40.0" y="77.4" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >en ninguna cuenta.</text>
<text x="40.0" y="118.6" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Sobre la escalera: se frenan midiendo ese nivel</text>
<circle cx="193.0" cy="152.6" r="11" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.6"/>
<text x="193.0" y="157.1" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >7</text>
<text x="213.0" y="154.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Confundir capital con clientes</text>
<text x="213.0" y="170.8" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: si mañana aparecieran diez clientes,</text>
<text x="213.0" y="186.4" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >¿se los podría atender? (§3.5)</text>
<rect x="40.0" y="140.6" width="128.0" height="51.4" rx="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="50.0" y="158.6" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >Nivel 5</text>
<text x="50.0" y="175.1" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Capital y ruina</text>
<circle cx="193.0" cy="214.0" r="11" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.6"/>
<text x="193.0" y="218.5" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >1</text>
<text x="213.0" y="216.0" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >El volante dibujado</text>
<text x="213.0" y="232.3" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: un número en dos flechas, o admitirlo</text>
<text x="213.0" y="247.9" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >como hipótesis</text>
<rect x="40.0" y="202.0" width="128.0" height="51.4" rx="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="50.0" y="220.0" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >Nivel 4</text>
<text x="50.0" y="236.5" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >El lazo</text>
<circle cx="193.0" cy="275.5" r="11" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.6"/>
<text x="193.0" y="280.0" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >11</text>
<text x="213.0" y="277.5" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Casarse con la curva</text>
<text x="213.0" y="293.7" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: cada cierto número de duplicaciones,</text>
<text x="213.0" y="309.3" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >preguntar qué cambió en el cliente</text>
<rect x="40.0" y="263.5" width="128.0" height="62.5" rx="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="50.0" y="281.5" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >Nivel 3</text>
<text x="50.0" y="298.0" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Curva de</text>
<text x="50.0" y="313.2" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >aprendizaje</text>
<circle cx="193.0" cy="348.0" r="11" fill="#eb6834" stroke="#eb6834" stroke-width="1.6"/>
<circle cx="193.0" cy="348.0" r="14.5" fill="none" stroke="#eb6834" stroke-width="1.4"/>
<text x="193.0" y="352.5" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >2</text>
<text x="213.0" y="350.0" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >La escala como tapa del margen</text>
<text x="213.0" y="366.2" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: medir el margen (G1) antes de buscar la</text>
<text x="213.0" y="381.8" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >curva (G2)</text>
<text x="213.0" y="398.4" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >la forma más común de quebrar creciendo</text>
<text x="213.0" y="414.0" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >(§6.3)</text>
<circle cx="193.0" cy="437.6" r="11" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.6"/>
<text x="193.0" y="442.1" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >6</text>
<text x="213.0" y="439.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >La dependencia disfrazada de margen</text>
<text x="213.0" y="455.9" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: calcular el margen sin ese renglón</text>
<rect x="40.0" y="336.0" width="128.0" height="125.5" rx="5" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.4"/>
<text x="50.0" y="354.0" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >Nivel 2</text>
<text x="50.0" y="370.5" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Margen</text>
<circle cx="193.0" cy="483.5" r="11" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.6"/>
<text x="193.0" y="488.0" font-size="12" fill="#fcfcfb" font-weight="700" text-anchor="middle" >4</text>
<text x="213.0" y="485.5" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >La plataforma sin cliente</text>
<text x="213.0" y="501.7" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: el control G0 y la prueba del peldaño</text>
<rect x="40.0" y="471.5" width="128.0" height="47.2" rx="5" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.4"/>
<text x="50.0" y="489.5" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >Nivel 1</text>
<text x="50.0" y="506.0" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Repetir</text>
<line x1="522.4" y1="104.6" x2="522.4" y2="518.7" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="537.4" y="118.6" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Fuera de la escalera: no aparecen en</text>
<text x="537.4" y="136.1" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >ninguna cuenta</text>
<circle cx="548.4" cy="169.6" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6"/>
<text x="548.4" y="174.1" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle" >3</text>
<text x="568.4" y="171.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Automatizar el paso que había que borrar</text>
<text x="568.4" y="187.8" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: la receta R4, el algoritmo de cinco</text>
<text x="568.4" y="203.4" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >pasos</text>
<circle cx="548.4" cy="229.0" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6"/>
<text x="548.4" y="233.5" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle" >5</text>
<text x="568.4" y="231.0" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >El sueño sin promesa con fecha</text>
<text x="568.4" y="247.3" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: una promesa chica, con fecha, que</text>
<text x="568.4" y="262.9" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >pueda resultar falsa en 90 días</text>
<circle cx="548.4" cy="288.5" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6"/>
<text x="548.4" y="293.0" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle" >8</text>
<text x="568.4" y="290.5" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Copiar el rasgo en vez del mecanismo</text>
<text x="568.4" y="306.7" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: copiar el mecanismo, que es barato</text>
<circle cx="548.4" cy="332.3" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6"/>
<text x="548.4" y="336.8" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle" >9</text>
<text x="568.4" y="334.3" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >El sesgo de supervivencia como plan</text>
<text x="568.4" y="350.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: por cada éxito, buscar dos parecidos</text>
<text x="568.4" y="366.2" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >que desaparecieron</text>
<circle cx="548.4" cy="391.8" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6"/>
<text x="548.4" y="396.3" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle" >10</text>
<text x="568.4" y="393.8" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >El genio solo</text>
<text x="568.4" y="410.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: la prueba de las seis funciones (§1.3)</text>
<circle cx="548.4" cy="435.6" r="11" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6"/>
<text x="548.4" y="440.1" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle" >12</text>
<text x="568.4" y="437.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Crecer más rápido que la calidad</text>
<text x="568.4" y="453.9" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Antídoto: que el control de calidad escale antes</text>
<text x="568.4" y="469.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >que el volumen</text>
<line x1="40.0" y1="536.7" x2="860.0" y2="536.7" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="563.7" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Seis de los doce errores se cometen sobre la escalera, y se frenan midiendo el nivel donde ocurren;</text>
<text x="40.0" y="584.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >los otros seis no aparecen en ninguna cuenta y se frenan con una receta, una prueba o una pregunta.</text>
<text x="40.0" y="604.7" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >El error 2, escalar antes de tener margen, se siente como éxito hasta el último mes.</text>
<text x="40.0" y="628.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >[interpretación] La Parte 7 nombra el nivel sólo en el error 1; en los errores 2, 4 y 7 se deduce del control o la sección que cita el antídoto (G1,</text>
<text x="40.0" y="644.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >G0, §3.5), y en los errores 6 y 11, de lo que mide el antídoto (el margen, las duplicaciones). Que el error 2 sea el más común lo afirma el libro</text>
<text x="40.0" y="659.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >(§6.3); nadie lo midió.</text>
<text x="40.0" y="681.3" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>