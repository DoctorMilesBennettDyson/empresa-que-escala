<text x="143.2" y="201.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >están amontonados acá,</text>
<text x="143.2" y="216.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >en el primer 12 % del eje</text>
<text x="40.0" y="472.6" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >B · Como hay que mirarla</text>
<text x="40.0" y="489.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >cada marca del eje es el doble de la anterior</text>
