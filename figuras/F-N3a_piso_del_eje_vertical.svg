<text x="325.0" y="543.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >el doble de unidades,</text>
<text x="325.0" y="558.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >y la misma bajada: −20 %</text>
<line x1="40.0" y1="810.6" x2="560.0" y2="810.6" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="837.6" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >La curva no se aplanó: cada escalón pide el doble de volumen que</text>
<text x="40.0" y="857.8" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >el anterior.</text>
<text x="40.0" y="878.6" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >De 128 a 256 unidades hacen falta 128 más; de 512 a 1.024, 512 más. Mirada por mes</text>
<text x="40.0" y="895.8" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >parece un piso; mirada por duplicación, sigue bajando.</text>
<text x="40.0" y="919.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Ley de Wright con r = 20 % por duplicación (b = 0,322). La curva no es automática: baja sólo</text>
<text x="40.0" y="935.2" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >si en cada duplicación alguien rediseña el proceso.</text>
