<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 736" width="600" height="736" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">La fortuna es un producto</title>
<desc id="d">Cinco barras que se multiplican: habilidad operativa, capital inicial, apoyo externo, supervivencia a eventos de todo o nada y momento del mercado. Con la supervivencia en cero, el resultado es cero.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="600" height="736" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >«Trabajó duro y con inteligencia»: ¿cuánto</text>
<text x="40.0" y="64.3" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >explica?</text>
<text x="40.0" y="86.1" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >El resultado es un producto de cinco factores, no una suma. Tres no dependen</text>
<text x="40.0" y="104.7" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >de la persona.</text>
<text x="64.0" y="143.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >Una trayectoria</text>
<text x="330.0" y="143.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start" >La misma, con un evento perdido</text>
<text x="64.0" y="169.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Habilidad operativa</text>
<text x="64.0" y="185.4" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >se enseña como procedimiento: este libro</text>
<rect x="64.0" y="193.4" width="230.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="64.0" y="193.4" width="207.0" height="20.0" fill="#2a78d6"/>
<rect x="330.0" y="193.4" width="230.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="330.0" y="193.4" width="207.0" height="20.0" fill="#2a78d6"/>
<text x="64.0" y="235.4" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Capital inicial</text>
<text x="64.0" y="250.9" font-size="11.5" fill="#8a8984" font-weight="400" text-anchor="start" >no se enseña: fija el punto de partida, no la pendiente</text>
<text x="42.0" y="236.4" font-size="17" fill="#8a8984" font-weight="700" text-anchor="start" >×</text>
<rect x="64.0" y="258.9" width="230.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="64.0" y="258.9" width="138.0" height="20.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<rect x="330.0" y="258.9" width="230.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="330.0" y="258.9" width="138.0" height="20.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="64.0" y="300.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Apoyo externo al riesgo</text>
<text x="64.0" y="316.4" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >contratos, créditos, compras públicas</text>
<text x="42.0" y="301.9" font-size="17" fill="#8a8984" font-weight="700" text-anchor="start" >×</text>
<rect x="64.0" y="324.4" width="230.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="64.0" y="324.4" width="161.0" height="20.0" fill="#2a78d6"/>
<rect x="330.0" y="324.4" width="230.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="330.0" y="324.4" width="161.0" height="20.0" fill="#2a78d6"/>
<text x="64.0" y="366.4" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Supervivencia a eventos de todo o nada</text>
<text x="64.0" y="381.9" font-size="11.5" fill="#8a8984" font-weight="400" text-anchor="start" >no se enseña; se administra: acotar la apuesta</text>
<text x="42.0" y="367.4" font-size="17" fill="#8a8984" font-weight="700" text-anchor="start" >×</text>
<rect x="64.0" y="390.0" width="230.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="64.0" y="390.0" width="184.0" height="20.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<rect x="330.0" y="390.0" width="230.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<text x="336.0" y="405.0" font-size="13" fill="#eb6834" font-weight="700" text-anchor="start" >0</text>
<text x="64.0" y="432.0" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >El momento del mercado</text>
<text x="64.0" y="447.5" font-size="11.5" fill="#8a8984" font-weight="400" text-anchor="start" >no se enseña; no estorbar: no vender en pánico ni apostar todo en un pico</text>
<text x="42.0" y="433.0" font-size="17" fill="#8a8984" font-weight="700" text-anchor="start" >×</text>
<rect x="64.0" y="455.5" width="230.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="64.0" y="455.5" width="161.0" height="20.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<rect x="330.0" y="455.5" width="230.0" height="20" fill="none" stroke="#e6e5e0" stroke-width="1"/>
<rect x="330.0" y="455.5" width="161.0" height="20.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<line x1="40.0" y1="487.5" x2="560.0" y2="487.5" stroke="#8a8984" stroke-width="1.0"/>
<text x="42.0" y="513.5" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start" >=</text>
<text x="64.0" y="513.5" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start" >Resultado</text>
<rect x="64.0" y="523.5" width="48.7" height="22.0" fill="#2a78d6"/>
<text x="120.7" y="539.5" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >0,21</text>
<rect x="330.0" y="523.5" width="230.0" height="22" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="338.0" y="539.5" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >0: todo en cero</text>
<line x1="40.0" y1="571.5" x2="560.0" y2="571.5" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="598.5" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >«Trabajó duro y con inteligencia» describe una barra de cinco y</text>
<text x="40.0" y="618.7" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >la presenta como la ecuación entera.</text>
<text x="40.0" y="639.5" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Lo que se puede hacer con las grises: no estorbar al momento del mercado y acotar</text>
<text x="40.0" y="656.7" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >las apuestas para que ningún evento único deje un factor en cero.</text>
<text x="40.0" y="680.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >[hipótesis] Marco para pensar, no modelo estimado: los largos de las barras son ilustrativos y</text>
<text x="40.0" y="696.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >nadie midió cuánto pesa cada factor. Barras rayadas: lo que no depende de la persona.</text>
<text x="40.0" y="717.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>