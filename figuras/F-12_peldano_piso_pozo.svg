<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 537" width="900" height="537" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Peldaño, piso y pozo</title>
<desc id="d">Matriz de dos por dos: vende hoy y abarata la siguiente es peldaño; sólo vende, piso; sólo abarata, pozo; ninguna, cortar. Escaleras: Falcon 1, Falcon 9, Starship y Starlink; y encargo, molde, segundo producto en un taller.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="900" height="537" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Esta etapa es un peldaño, un piso o un pozo?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Dos preguntas, cuatro casillas. Y dos escaleras: una real y una a escala de taller.</text>
<text x="237.0" y="97.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle" >¿Abarata la etapa siguiente?</text>
<text x="170.5" y="117.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="middle" >Sí</text>
<text x="303.5" y="117.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="middle" >No</text>
<text x="48.0" y="205.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle" transform="rotate(-90 48 205.93)">¿Vende algo hoy?</text>
<text x="94.0" y="172.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="end" >Sí</text>
<rect x="107.0" y="134.9" width="127.0" height="68.0" rx="4" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.6"/>
<text x="170.5" y="166.9" font-size="15" fill="#fcfcfb" font-weight="700" text-anchor="middle" >PELDAÑO</text>
<text x="170.5" y="184.4" font-size="11.5" fill="#fcfcfb" font-weight="400" text-anchor="middle" >se sube por acá</text>
<rect x="240.0" y="134.9" width="127.0" height="68.0" rx="4" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="303.5" y="166.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >PISO</text>
<text x="303.5" y="184.4" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >se vive bien, pero</text>
<text x="303.5" y="200.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >no se sube</text>
<text x="94.0" y="246.9" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="end" >No</text>
<rect x="107.0" y="208.9" width="127.0" height="68.0" rx="4" fill="#fbd9ca" stroke="#eb6834" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="170.5" y="240.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >POZO</text>
<text x="170.5" y="258.4" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >saber cuánto dura</text>
<text x="170.5" y="274.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >(§3.5)</text>
<rect x="240.0" y="208.9" width="127.0" height="68.0" rx="4" fill="#ecebe6" stroke="#8a8984" stroke-width="1.6"/>
<text x="303.5" y="240.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle" >CORTAR</text>
<text x="303.5" y="258.4" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >no vende ni abarata</text>
<text x="410.0" y="98.9" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >SpaceX</text>
<rect x="410.0" y="141.9" width="135.3" height="92.6" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="418.0" y="158.9" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Falcon 1</text>
<text x="418.0" y="174.9" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start" >pozo</text>
<text x="418.0" y="190.4" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >no era un negocio:</text>
<text x="418.0" y="206.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >instaló la posición</text>
<line x1="548.3" y1="188.2" x2="564.3" y2="172.2" stroke="#0b0b0b" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="567.3" y="125.9" width="135.3" height="92.6" rx="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.8"/>
<text x="575.3" y="142.9" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Falcon 9</text>
<text x="575.3" y="158.9" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start" >peldaño</text>
<text x="575.3" y="174.4" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >vende y financia el</text>
<text x="575.3" y="190.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >siguiente</text>
<line x1="705.7" y1="172.2" x2="721.7" y2="156.2" stroke="#0b0b0b" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="724.7" y="109.9" width="135.3" height="92.6" rx="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.8"/>
<text x="732.7" y="126.9" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Starship y Starlink</text>
<text x="732.7" y="142.9" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start" >peldaño</text>
<text x="732.7" y="158.4" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >Starlink es la carga</text>
<text x="732.7" y="174.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >que justifica la</text>
<text x="732.7" y="189.5" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >escala</text>
<text x="410.0" y="269.5" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Un taller (ilustrativo)</text>
<rect x="410.0" y="312.5" width="135.3" height="77.0" rx="4" fill="#fcfcfb" stroke="#8a8984" stroke-width="1.8"/>
<text x="418.0" y="329.5" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Encargo a pedido</text>
<text x="418.0" y="345.5" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="start" >piso</text>
<text x="418.0" y="361.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >si no deja nada</text>
<text x="418.0" y="376.5" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >instalado</text>
<line x1="548.3" y1="351.0" x2="564.3" y2="335.0" stroke="#0b0b0b" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="567.3" y="296.5" width="135.3" height="77.0" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="575.3" y="313.5" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >El primer molde</text>
<text x="575.3" y="329.5" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start" >pozo</text>
<text x="575.3" y="345.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >no es un producto:</text>
<text x="575.3" y="360.5" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >es una posición</text>
<line x1="705.7" y1="335.0" x2="721.7" y2="319.0" stroke="#0b0b0b" stroke-width="1.4" marker-end="url(#fl)"/>
<rect x="724.7" y="280.5" width="135.3" height="77.0" rx="4" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.8"/>
<text x="732.7" y="297.5" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >El segundo producto</text>
<text x="732.7" y="313.5" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="start" >peldaño</text>
<text x="732.7" y="329.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >sale más barato con</text>
<text x="732.7" y="344.5" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start" >el mismo molde</text>
<line x1="40.0" y1="407.6" x2="860.0" y2="407.6" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="434.6" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >No se escala un proyecto: se escala una posición, desde la cual el siguiente arranca más barato.</text>
<text x="40.0" y="455.3" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >La pregunta de cada etapa: ¿qué queda instalado cuando termine, que haga más barata la siguiente? «Más clientes» o «más</text>
<text x="40.0" y="472.6" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >experiencia» no es un peldaño: es un piso.</text>
<text x="40.0" y="496.3" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >La escalera de SpaceX resume la Parte 2; la del taller es ilustrativa.</text>
<text x="40.0" y="517.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>