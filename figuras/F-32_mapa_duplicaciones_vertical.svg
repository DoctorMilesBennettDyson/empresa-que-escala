<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 741" width="600" height="741" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">El mapa de duplicaciones</title>
<desc id="d">Escalera de siete órdenes de magnitud de facturación anual, de mil dólares a mil millones, unas veinte duplicaciones en total, con lo que mata al negocio en cada peldaño.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="600" height="741" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >De mil dólares a mil millones por año:</text>
<text x="40.0" y="64.3" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿cuántas duplicaciones?</text>
<text x="40.0" y="86.1" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Unas 20, no mil: cada orden de magnitud son unas 3,3. Y en cada uno cambia lo</text>
<text x="40.0" y="104.7" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >que mata.</text>
<rect x="40.0" y="135.9" width="84.0" height="46.0" rx="3" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="134.0" y="149.9" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >10⁹ · US$1.000 millones · corporación</text>
<text x="134.0" y="166.9" font-size="12" fill="#eb6834" font-weight="600" text-anchor="start" >mata: el gobierno interno y la regulación</text>
<text x="134.0" y="181.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >≈ 19,9 duplicaciones desde la base</text>
<rect x="40.0" y="193.9" width="75.0" height="46.0" rx="3" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="125.0" y="207.9" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >10⁸ · US$100 millones · empresa grande</text>
<text x="125.0" y="224.9" font-size="12" fill="#eb6834" font-weight="600" text-anchor="start" >mata: el mercado</text>
<text x="125.0" y="239.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >≈ 16,6 duplicaciones desde la base</text>
<rect x="40.0" y="251.9" width="66.0" height="46.0" rx="3" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="116.0" y="265.9" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >10⁷ · US$10 millones · empresa mediana</text>
<text x="116.0" y="282.9" font-size="12" fill="#eb6834" font-weight="600" text-anchor="start" >mata: el capital de trabajo</text>
<text x="116.0" y="297.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >≈ 13,3 duplicaciones desde la base</text>
<rect x="40.0" y="309.9" width="57.0" height="46.0" rx="3" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="107.0" y="323.9" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >10⁶ · US$1 millón · pequeña empresa</text>
<text x="107.0" y="340.9" font-size="12" fill="#eb6834" font-weight="600" text-anchor="start" >mata: la calidad delegada</text>
<text x="107.0" y="355.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >≈ 10,0 duplicaciones desde la base</text>
<rect x="40.0" y="367.9" width="48.0" height="46.0" rx="3" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="98.0" y="381.9" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >10⁵ · US$100.000 · negocio chico</text>
<text x="98.0" y="398.9" font-size="12" fill="#eb6834" font-weight="600" text-anchor="start" >mata: la caja</text>
<text x="98.0" y="413.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >≈ 6,6 duplicaciones desde la base</text>
<rect x="40.0" y="425.9" width="39.0" height="46.0" rx="3" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="89.0" y="439.9" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >10⁴ · US$10.000 · oficio propio</text>
<text x="89.0" y="456.9" font-size="12" fill="#eb6834" font-weight="600" text-anchor="start" >mata: el tiempo del dueño</text>
<text x="89.0" y="471.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >≈ 3,3 duplicaciones desde la base</text>
<rect x="40.0" y="483.9" width="30.0" height="46.0" rx="3" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="80.0" y="497.9" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >10³ · US$1.000 · trabajo ocasional</text>
<text x="80.0" y="514.9" font-size="12" fill="#eb6834" font-weight="600" text-anchor="start" >mata: no empezar</text>
<text x="80.0" y="529.9" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >la base</text>
<line x1="40.0" y1="555.9" x2="560.0" y2="555.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="582.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Son unas 20 duplicaciones: es finito y contable. Pero cada una</text>
<text x="40.0" y="603.1" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >cuesta más que la anterior, porque en cada orden cambia el</text>
<text x="40.0" y="623.4" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >cuello de botella.</text>
<text x="40.0" y="644.1" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Quien es excelente en 10⁴ fracasa en 10⁶ haciendo exactamente lo que lo hizo</text>
<text x="40.0" y="661.4" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >excelente.</text>
<text x="40.0" y="685.1" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >log₂ 10⁶ = 19,9. Lo que mata en cada orden es una heurística [hipótesis]: los modelos de</text>
<text x="40.0" y="700.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >etapas de crecimiento no tienen confirmación empírica (Levie y Lichtenstein 2010).</text>
<text x="40.0" y="722.4" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>