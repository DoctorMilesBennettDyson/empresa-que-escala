<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Cuánto bajó en quince años una batería de ion-litio?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Lo que costaría un paquete de 60 kWh (tamaño ilustrativo, del orden del de un auto eléctrico) al precio promedio de cada</text>
<text x="40.0" y="77.4" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >año. Cada cuadrito es US$1.000.</text>
<text x="40.0" y="118.1" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >2010: más de US$1.100 por kWh → más de US$66.000 el paquete</text>
