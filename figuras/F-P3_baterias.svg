<text x="288.0" y="305.0" font-size="14" fill="#2a78d6" font-weight="700" text-anchor="start" >más de 10 veces menos</text>
<line x1="40.0" y1="333.0" x2="860.0" y2="333.0" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="360.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >El mismo paquete de 60 kWh pasó de más de US$66.000 a unos US$6.480: más de diez veces menos en</text>
<text x="40.0" y="380.3" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >quince años.</text>
<text x="40.0" y="401.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >En esos años la producción acumulada creció enormemente, como predice la ley de Wright. Pero con producción exponencial, una simple</text>
<text x="40.0" y="418.3" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >tendencia contra el tiempo predice casi igual de bien (Nagy et al. 2013).</text>
<text x="40.0" y="442.0" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Precio promedio del paquete de ion-litio, BloombergNEF: 2010, más de US$1.100/kWh [reportado; la serie se reexpresa cada año en dólares constantes];</text>
<text x="40.0" y="457.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >2025, US$108/kWh [verificado, primaria — encuesta de diciembre de 2025]. El tamaño de 60 kWh es ilustrativo: 60 × 1.100 = 66.000; 60 × 108 = 6.480</text>
<text x="40.0" y="473.2" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >[cálculo].</text>
