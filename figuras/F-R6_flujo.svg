<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Medir el flujo</title>
<desc id="d">Un pedido de unos 7 días en una barra: tres franjas azules finas (corte, soldadura, pintura; 2 h 15 min en total) entre esperas grises. Cociente: 1,3 %.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="900" height="597" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Dónde se va el tiempo de un pedido?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Un pedido en un taller, desde que entra hasta que se retira (ejemplo ilustrativo). Azul: los pasos que cambian algo que</text>
<text x="40.0" y="77.4" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >el cliente pagaría. Gris: espera.</text>
<text x="40.0" y="117.6" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >El recorrido, a escala: el ancho de cada tramo es su duración</text>
<rect x="40.0" y="170.6" width="346.8" height="34.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="213.4" y="222.6" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle" >en cola</text>
<text x="213.4" y="237.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >3 días</text>
<rect x="386.8" y="170.6" width="3.6" height="34.0" fill="#2a78d6"/>
<line x1="388.6" y1="167.6" x2="388.6" y2="158.6" stroke="#2a78d6" stroke-width="1.2"/>
<text x="388.6" y="154.6" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="middle" >corte · 45 min</text>
<rect x="390.4" y="170.6" width="115.6" height="34.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="448.2" y="222.6" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle" >espera</text>
<text x="448.2" y="237.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >1 día</text>
<rect x="506.0" y="170.6" width="4.8" height="34.0" fill="#2a78d6"/>
<line x1="508.4" y1="167.6" x2="508.4" y2="140.6" stroke="#2a78d6" stroke-width="1.2"/>
<text x="508.4" y="136.6" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="middle" >soldadura · 1 h</text>
<rect x="510.8" y="170.6" width="231.2" height="34.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="626.4" y="222.6" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle" >espera pintura</text>
<text x="626.4" y="237.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >2 días</text>
<rect x="742.0" y="170.6" width="3.0" height="34.0" fill="#2a78d6"/>
<line x1="743.2" y1="167.6" x2="743.2" y2="158.6" stroke="#2a78d6" stroke-width="1.2"/>
<text x="743.2" y="154.6" font-size="11.5" fill="#2a78d6" font-weight="700" text-anchor="middle" >pintura · 30 min</text>
<rect x="744.4" y="170.6" width="115.6" height="34.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="802.2" y="222.6" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle" >espera retiro</text>
<text x="802.2" y="237.6" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle" >1 día</text>
<text x="40.0" y="283.6" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Lo que se suele medir: la fabricación</text>
<rect x="40.0" y="292.6" width="10.8" height="24.0" fill="#2a78d6"/>
<text x="60.8" y="309.6" font-size="13.5" fill="#2a78d6" font-weight="700" text-anchor="start" >2 h 15 min</text>
<text x="40.0" y="349.6" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >Lo que espera el cliente</text>
<rect x="40.0" y="358.6" width="820.0" height="24.0" fill="url(#rayas_gris)" stroke="#8a8984" stroke-width="1.2"/>
<text x="860.0" y="402.6" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="end" >unos 7 días</text>
<text x="40.0" y="426.6" font-size="14" fill="#2a78d6" font-weight="700" text-anchor="start" >tiempo que agrega valor ÷ tiempo total = 1,3 %</text>
<line x1="40.0" y1="449.5" x2="860.0" y2="449.5" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="476.5" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >De unos 7 días, el pedido pasa 2 horas y cuarto en pasos que agregan valor: el 1,3 % del tiempo. El</text>
<text x="40.0" y="496.7" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >resto es espera.</text>
<text x="40.0" y="517.5" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Medir sólo la fabricación esconde lo principal: en la mayoría de los procesos, la espera es la mayor parte.</text>
<text x="40.0" y="541.2" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Ejemplo ilustrativo, no un dato medido: los tiempos están elegidos para mostrar la receta R6. Con datos reales, el cociente se calcula igual: tiempo</text>
<text x="40.0" y="556.8" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >que agrega valor ÷ tiempo total.</text>
<text x="40.0" y="578.5" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>