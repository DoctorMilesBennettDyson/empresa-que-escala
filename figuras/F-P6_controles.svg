<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 759" width="900" height="759" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Los cinco controles</title>
<desc id="d">Diagrama de decisión: G0 unidad, G1 margen, G2 curva, G3 activo y G4 caja, en orden. Cada «no» va a la salida elegida antes (matar, repetir con menos alcance o cambiar); cinco «sí» llevan a gastar en la etapa siguiente.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="900" height="759" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Qué se revisa antes de gastar en la etapa siguiente?</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Los cinco controles de una escalera, en orden. Cada uno se responde con sí o no, con un número y una fecha; qué hacer</text>
<text x="40.0" y="77.4" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >ante un «no» se elige antes de empezar la etapa.</text>
<rect x="80.0" y="104.6" width="420.0" height="32.0" rx="6" fill="#ecebe6" stroke="#8a8984" stroke-width="1.2"/>
<text x="290.0" y="125.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle" >Antes de gastar en la etapa siguiente</text>
<line x1="290.0" y1="136.6" x2="290.0" y2="160.6" stroke="#8a8984" stroke-width="1.3" marker-end="url(#fl)"/>
<path d="M40.0,184.7 L58.5,160.6 H521.5 L540.0,184.7 L521.5,208.8 H58.5 Z" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="290.0" y="179.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle" >G0 · Unidad</text>
<text x="290.0" y="195.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >la unidad que se repite está nombrada y su costo real, medido</text>
<line x1="540.0" y1="184.7" x2="576.0" y2="184.7" stroke="#eb6834" stroke-width="1.5"/>
<text x="546.0" y="178.7" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >no</text>
<line x1="290.0" y1="208.8" x2="290.0" y2="232.8" stroke="#8a8984" stroke-width="1.3" marker-end="url(#fl)"/>
<text x="298.0" y="224.8" font-size="12" fill="#52514e" font-weight="700" text-anchor="start" >sí</text>
<path d="M40.0,256.9 L58.5,232.8 H521.5 L540.0,256.9 L521.5,281.0 H58.5 Z" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="290.0" y="251.8" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle" >G1 · Margen</text>
<text x="290.0" y="267.8" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >m &gt; 0 con la hora propia al costo, medido en al menos 10 unidades reales</text>
<line x1="540.0" y1="256.9" x2="576.0" y2="256.9" stroke="#eb6834" stroke-width="1.5"/>
<text x="546.0" y="250.9" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >no</text>
<line x1="290.0" y1="281.0" x2="290.0" y2="305.0" stroke="#8a8984" stroke-width="1.3" marker-end="url(#fl)"/>
<text x="298.0" y="297.0" font-size="12" fill="#52514e" font-weight="700" text-anchor="start" >sí</text>
<path d="M40.0,337.2 L64.8,305.0 H515.2 L540.0,337.2 L515.2,369.4 H64.8 Z" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="290.0" y="324.0" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle" >G2 · Curva</text>
<text x="290.0" y="340.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >el costo por unidad ya bajó al menos una vez al duplicar, con datos</text>
<text x="290.0" y="356.2" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >propios</text>
<line x1="540.0" y1="337.2" x2="576.0" y2="337.2" stroke="#eb6834" stroke-width="1.5"/>
<text x="546.0" y="331.2" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >no</text>
<line x1="290.0" y1="369.4" x2="290.0" y2="393.4" stroke="#8a8984" stroke-width="1.3" marker-end="url(#fl)"/>
<text x="298.0" y="385.4" font-size="12" fill="#52514e" font-weight="700" text-anchor="start" >sí</text>
<path d="M40.0,417.5 L58.5,393.4 H521.5 L540.0,417.5 L521.5,441.6 H58.5 Z" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="290.0" y="412.4" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle" >G3 · Activo</text>
<text x="290.0" y="428.4" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >la etapa dejó instalado un activo nombrable</text>
<line x1="540.0" y1="417.5" x2="576.0" y2="417.5" stroke="#eb6834" stroke-width="1.5"/>
<text x="546.0" y="411.5" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >no</text>
<line x1="290.0" y1="441.6" x2="290.0" y2="465.6" stroke="#8a8984" stroke-width="1.3" marker-end="url(#fl)"/>
<text x="298.0" y="457.6" font-size="12" fill="#52514e" font-weight="700" text-anchor="start" >sí</text>
<path d="M40.0,497.8 L64.8,465.6 H515.2 L540.0,497.8 L515.2,530.0 H64.8 Z" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="290.0" y="484.6" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle" >G4 · Caja</text>
<text x="290.0" y="500.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >la autonomía supera el ancho del pozo de la etapa siguiente, con 30 % de</text>
<text x="290.0" y="516.8" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle" >margen</text>
<line x1="540.0" y1="497.8" x2="576.0" y2="497.8" stroke="#eb6834" stroke-width="1.5"/>
<text x="546.0" y="491.8" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >no</text>
<line x1="290.0" y1="530.0" x2="290.0" y2="558.0" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#fl_az)"/>
<text x="298.0" y="548.0" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >sí, a los cinco</text>
<rect x="80.0" y="558.0" width="420.0" height="34.0" rx="6" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="290.0" y="580.0" font-size="13.5" fill="#2a78d6" font-weight="700" text-anchor="middle" >Se gasta en la etapa siguiente</text>
<rect x="602.0" y="246.9" width="240.0" height="176.8" rx="6" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
<text x="614.0" y="267.4" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >A la fecha no se cumple: se</text>
<text x="614.0" y="284.2" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >ejecuta lo que se eligió al</text>
<text x="614.0" y="301.1" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start" >escribir el control</text>
<text x="614.0" y="321.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >· matar el proyecto (fin)</text>
<text x="614.0" y="338.7" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >· repetir la etapa con alcance</text>
<text x="614.0" y="354.9" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >reducido (vuelve arriba)</text>
<text x="614.0" y="372.1" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >· cambiar a otra cosa (fin de este</text>
<text x="614.0" y="388.3" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >proyecto)</text>
<text x="614.0" y="409.5" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >prohibido: «vemos cómo viene»</text>
<line x1="576.0" y1="184.7" x2="576.0" y2="497.8" stroke="#eb6834" stroke-width="1.5"/>
<line x1="576.0" y1="335.3" x2="600.0" y2="335.3" stroke="#eb6834" stroke-width="1.5" marker-end="url(#fl_na)"/>
<path d="M722.0,246.9 V120.6 H502.0" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fl_na)"/>
<text x="510.0" y="114.6" font-size="12" fill="#eb6834" font-weight="700" text-anchor="start" >repetir</text>
<line x1="40.0" y1="610.0" x2="860.0" y2="610.0" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="637.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Cinco preguntas en orden, cada una con su «no» decidido antes de empezar: sólo se gasta en la etapa</text>
<text x="40.0" y="657.2" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >siguiente si las cinco dan «sí».</text>
<text x="40.0" y="678.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Los controles no se saltean ni se reordenan. G2 sin G1 es la forma más común de quebrar creciendo, porque se siente como éxito</text>
<text x="40.0" y="695.2" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >hasta el último mes.</text>
<text x="40.0" y="719.0" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >Condiciones de §6.3 y salidas de la plantilla de §6.2. Es un diagrama de decisión: no tiene escala ni datos.</text>
<text x="40.0" y="740.6" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>