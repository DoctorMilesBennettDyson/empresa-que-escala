<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Los cinco niveles</title>
<desc id="d">Cinco preguntas en escalera: repetir, margen, curva de aprendizaje, lazo y capital. Los niveles 1 y 2 se ven en un dibujo; del 3 al 5 hace falta lápiz.</desc>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="fl_az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="fl_na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbd9ca"/><line x1="0" y1="0" x2="0" y2="7" stroke="#eb6834" stroke-width="3"/></pattern><pattern id="rayas_gris" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b4b3ad" stroke-width="2.5"/></pattern></defs>
<rect width="900" height="597" fill="#fcfcfb"/>
<text x="40.0" y="37.0" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start" >¿Esto puede crecer? La misma pregunta, cinco veces</text>
<text x="40.0" y="58.8" font-size="13.5" fill="#52514e" font-weight="400" text-anchor="start" >Cada nivel responde una pregunta y entrega lo que el siguiente necesita.</text>
<rect x="40.0" y="197.9" width="149.6" height="205.0" rx="6" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="52.0" y="219.9" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >Nivel 1</text>
<text x="52.0" y="240.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Repetir</text>
<text x="52.0" y="260.2" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >¿La cosa se repite,</text>
<text x="52.0" y="276.4" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >o cada vez se</text>
<text x="52.0" y="292.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >empieza de cero?</text>
<text x="52.0" y="336.9" font-size="11.5" fill="#8a8984" font-weight="700" text-anchor="start" >Da:</text>
<text x="52.0" y="353.4" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >la unidad que se</text>
<text x="52.0" y="369.7" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >repite</text>
<line x1="191.6" y1="372.9" x2="205.6" y2="372.9" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#fl)"/>
<rect x="207.6" y="169.9" width="149.6" height="233.0" rx="6" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="219.6" y="191.9" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >Nivel 2</text>
<text x="219.6" y="212.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Margen</text>
<text x="219.6" y="232.2" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >Cada vez que pasa</text>
<text x="219.6" y="248.4" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >una unidad, ¿entra</text>
<text x="219.6" y="264.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >más de lo que sale?</text>
<text x="219.6" y="336.9" font-size="11.5" fill="#8a8984" font-weight="700" text-anchor="start" >Da:</text>
<text x="219.6" y="353.4" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >el margen de cada</text>
<text x="219.6" y="369.7" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >unidad</text>
<line x1="359.2" y1="372.9" x2="373.2" y2="372.9" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#fl)"/>
<rect x="375.2" y="141.9" width="149.6" height="261.0" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="387.2" y="163.9" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >Nivel 3</text>
<text x="387.2" y="184.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Curva de</text>
<text x="387.2" y="203.2" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >aprendizaje</text>
<text x="387.2" y="222.5" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >¿Cuánto baja el</text>
<text x="387.2" y="238.7" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >costo cada vez que</text>
<text x="387.2" y="254.9" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >se duplica la</text>
<text x="387.2" y="271.1" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >producción?</text>
<text x="387.2" y="336.9" font-size="11.5" fill="#8a8984" font-weight="700" text-anchor="start" >Da:</text>
<text x="387.2" y="353.4" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >la tasa y las</text>
<text x="387.2" y="369.7" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >duplicaciones que</text>
<text x="387.2" y="385.9" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >faltan</text>
<line x1="526.8" y1="372.9" x2="540.8" y2="372.9" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#fl)"/>
<rect x="542.8" y="113.9" width="149.6" height="289.0" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="554.8" y="135.9" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >Nivel 4</text>
<text x="554.8" y="156.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >El lazo</text>
<text x="554.8" y="176.2" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >¿El sistema se</text>
<text x="554.8" y="192.4" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >sostiene solo, o hay</text>
<text x="554.8" y="208.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >que empujarlo para</text>
<text x="554.8" y="224.8" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >siempre?</text>
<text x="554.8" y="336.9" font-size="11.5" fill="#8a8984" font-weight="700" text-anchor="start" >Da:</text>
<text x="554.8" y="353.4" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >la ganancia del</text>
<text x="554.8" y="369.7" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >lazo</text>
<line x1="694.4" y1="372.9" x2="708.4" y2="372.9" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#fl)"/>
<rect x="710.4" y="85.9" width="149.6" height="317.0" rx="6" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="722.4" y="107.9" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start" >Nivel 5</text>
<text x="722.4" y="128.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Capital y ruina</text>
<text x="722.4" y="148.2" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >¿Alcanza el dinero</text>
<text x="722.4" y="164.4" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >para llegar hasta</text>
<text x="722.4" y="180.6" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >donde el negocio se</text>
<text x="722.4" y="196.8" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" >sostiene solo?</text>
<text x="722.4" y="336.9" font-size="11.5" fill="#8a8984" font-weight="700" text-anchor="start" >Da:</text>
<text x="722.4" y="353.4" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >la profundidad y</text>
<text x="722.4" y="369.7" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" >el ancho del pozo</text>
<line x1="40.0" y1="416.9" x2="357.2" y2="416.9" stroke="#2a78d6" stroke-width="2"/>
<line x1="375.2" y1="416.9" x2="860.0" y2="416.9" stroke="#2a78d6" stroke-width="2" stroke-dasharray="6 4"/>
<text x="40.0" y="438.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Se ven: un dibujo alcanza</text>
<text x="375.2" y="438.9" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" >Necesitan lápiz: sólo texto y cuenta propia</text>
<line x1="40.0" y1="464.9" x2="860.0" y2="464.9" stroke="#e6e5e0" stroke-width="1.0"/>
<text x="40.0" y="491.9" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >Los niveles 1 y 2 se entienden con un dibujo; del 3 al 5 hace falta lápiz, y por eso casi no</text>
<text x="40.0" y="512.2" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start" >circulan.</text>
<text x="40.0" y="532.9" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start" >Las cinco respuestas forman un motor: el activo que deja cada etapa es el piso de la misión siguiente.</text>
<text x="40.0" y="556.7" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >[hipótesis] Que los niveles 3 a 5 se transmitan peor es la hipótesis central de este libro; nadie la midió todavía.</text>
<text x="40.0" y="578.3" font-size="11" fill="#8a8984" font-weight="400" text-anchor="start" >© Pablo Luciano Rainieri Blasco · CC BY 4.0 · Fuente: Cómo se construye una empresa que escala</text>
</svg>