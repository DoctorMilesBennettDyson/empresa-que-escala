<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Página web del libro v2.0 (TAR-0186): un solo HTML, las figuras adentro. En pantalla de menos
   de 720 px cada figura cambia a su diagramación vertical (<picture> armado por _generar_web.py). */
:root { color-scheme: light; --tinta: #1b1b1a; --tinta2: #52514e; --linea: #dddcd6; --fondo: #fcfcfb; --suave: #f3f2ee; }
html { background: var(--fondo); }
body { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; color: var(--tinta); background: var(--fondo);
       font: 17px/1.6 Georgia, "Times New Roman", serif; overflow-x: hidden; }
h1, h2, h3, h4 { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; line-height: 1.25; }
h1 { font-size: 2rem; margin: 1.2em 0 .4em; }
h2 { font-size: 1.45rem; margin: 2.2em 0 .6em; padding-top: .6em; border-top: 1px solid var(--linea); }
h3 { font-size: 1.15rem; margin: 1.8em 0 .4em; }
h4 { font-size: 1rem; margin: 1.4em 0 .3em; }
a { color: #1f5fae; }
blockquote { margin: 1.2em 0; padding: .2em 1em; border-left: 4px solid var(--tinta); font-weight: 600; }
code { font-size: .9em; background: var(--suave); padding: 0 .25em; border-radius: 3px; }
table { display: block; overflow-x: auto; border-collapse: collapse; margin: 1.2em 0; font-size: .88rem; line-height: 1.4; }
th, td { border-bottom: 1px solid var(--linea); padding: .4em .6em; text-align: left; vertical-align: top; }
th { font-family: "Segoe UI", Arial, sans-serif; background: var(--suave); }
.acertijo { margin: 1.4em 0; padding: .8em 1em; border: 1.5px dashed var(--tinta); border-radius: 8px; background: var(--suave); }
.acertijo p { margin: 0; }
p.legal { font-size: .8rem; color: var(--tinta2); }
/* la figura apaisada mide 900 px: se sale de la columna de texto para no achicar la letra */
figure { width: min(900px, calc(100vw - 32px)); margin: 1.6em 0; position: relative; left: 50%; transform: translateX(-50%); }
figure img { display: block; width: 100%; height: auto; border-radius: 6px; }
figcaption { max-width: 760px; margin: .5em auto 0; font-size: .85rem; color: var(--tinta2);
             font-family: "Segoe UI", Arial, sans-serif; }
nav#TOC { font-family: "Segoe UI", Arial, sans-serif; font-size: .9rem; background: var(--suave);
          border-radius: 8px; padding: .6em 1.2em; margin: 1.5em 0; }
nav#TOC ul { padding-left: 1.1em; }
nav#TOC > ul > li { margin: .25em 0; }
#anexo-c-fuentes-leídas-para-la-parte-11 li { font-size: .8rem; word-break: break-all; }
@media (max-width: 720px) { body { font-size: 16px; } figure { width: 100%; left: 0; transform: none; } }
</style>
